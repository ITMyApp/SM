          <div className="flex-1 min-w-0 rounded-2xl p-3 flex flex-col justify-center transition-all duration-300" style={{ backgroundColor: pineDeep, boxShadow: shadowMd }}>
            <p className="ff-sans text-[9px] uppercase tracking-wide leading-tight font-semibold" style={{ color: "#8FA183" }}>Periodo</p>
            <p className="ff-serif text-lg sm:text-xl mt-1 truncate" style={{ color: paper }}>{etichettaPeriodo}</p>
          </div>
          <div className="flex flex-col items-end gap-1.5 shrink-0">
            <div className="flex rounded-xl overflow-hidden" style={{ border: "1px solid #DDD8C6", width: 190, height: 34 }}>
              {["mese", "anno"].map((p) => (<button key={p} onClick={() => setPeriodo(p)} className="ff-sans text-sm capitalize flex-1" style={{ backgroundColor: periodo === p ? pine : card, color: periodo === p ? paper : muted }}>{p}</button>))}
            </div>
            <SelettorePeriodo meseVal={filtroMese} annoVal={filtroAnno} onMese={setFiltroMese} onAnno={setFiltroAnno} />
          </div>
        </div>

        <div className="grid grid-cols-3 gap-2.5 mb-5">
  <div className="rounded-2xl p-3.5 sm:p-4 transition-all duration-300" style={{ backgroundColor: pineDeep, boxShadow: shadowMd }}>
    <p className="ff-sans text-[9px] uppercase tracking-wide leading-tight font-semibold" style={{ color: "#8FA183" }}>Incassato</p>
    <p className="ff-serif text-xl sm:text-2xl mt-1" style={{ color: paper }}>€{totIncassato}</p>
    <p className="ff-sans text-[10px] mt-1 flex items-center gap-0.5 font-medium" style={{ color: goldSoft }}><ArrowUpRight size={10} /> €{totPrevisto}</p>
  </div>
  <div className="rounded-2xl p-3.5 sm:p-4 transition-all duration-300" style={{ backgroundColor: card, boxShadow: shadowSm }}>
    <p className="ff-sans text-[9px] uppercase tracking-wide leading-tight font-semibold" style={{ color: faint }}>Totale</p>
    <p className="ff-serif text-xl sm:text-2xl mt-1" style={{ color: ink }}>€{totIncassato + totPrevisto}</p>
    <p className="ff-sans text-[10px] mt-1" style={{ color: faint }}>{periodo === "mese" ? "questo mese" : "quest'anno"}</p>
  </div>
  <div className="rounded-2xl p-3.5 sm:p-4 transition-all duration-300" style={{ backgroundColor: card, boxShadow: shadowSm }}>
    <p className="ff-sans text-[9px] uppercase tracking-wide leading-tight font-semibold" style={{ color: faint }}>Clienti attivi</p>
    <p className="ff-serif text-xl sm:text-2xl mt-1" style={{ color: ink }}>{statistiche.clientiAttivi}</p>
    <p className="ff-sans text-[10px] mt-1" style={{ color: faint }}>{statistiche.animaliAttivi} animali</p>
  </div>
</div>
      </div>

      <div className="rounded-2xl p-4 sm:p-5 mb-6" style={{ backgroundColor: card }}>
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <p className="ff-sans text-sm font-medium" style={{ color: ink }}>Andamento incasso</p>
          <div className="flex items-center gap-3 ff-sans text-xs" style={{ color: muted }}>
            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ backgroundColor: pine }} />Incassato</span>
            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ backgroundColor: goldSoft }} />Previsto</span>
          </div>
        </div>
        <ResponsiveContainer width="100%" height={170}>
          <BarChart data={dati} margin={{ top: 4, right: 6, left: 0, bottom: 0 }} barCategoryGap={periodo === "mese" ? "22%" : "30%"}>
            <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{ fontSize: 10, fill: faint }} interval={periodo === "mese" ? 3 : 0} padding={{ left: 8, right: 8 }} />
            <Tooltip contentStyle={{ borderRadius: 10, border: "none", fontSize: 12 }} formatter={(v) => `€${v}`} />
            <Bar dataKey="incassato" stackId="a" fill={pine} radius={[0, 0, 0, 0]} cursor={periodo === "mese" ? "pointer" : "default"} onClick={handleBarClick} />
            <Bar dataKey="previsto" stackId="a" fill={goldSoft} radius={[4, 4, 0, 0]} cursor={periodo === "mese" ? "pointer" : "default"} onClick={handleBarClick} />
          </BarChart>
        </ResponsiveContainer>
        {periodo === "mese" && (
          <p className="ff-sans text-[11px] mt-2" style={{ color: faint }}>Clicca un giorno nel grafico per i dettagli</p>
        )}
      </div>


      <div className="rounded-2xl p-4 sm:p-5 mb-6" style={{ backgroundColor: card }}>
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <p className="ff-sans text-sm font-medium flex items-center gap-1.5" style={{ color: ink }}><Trophy size={14} color={gold} /> Classifica clienti</p>
          <div className="flex rounded-lg overflow-hidden" style={{ border: "1px solid #DDD8C6" }}>
            <button onClick={() => setOrdina("incasso")} className="ff-sans text-[11px] px-2.5 py-1.5" style={{ backgroundColor: ordina === "incasso" ? pine : "transparent", color: ordina === "incasso" ? paper : muted }}>Per incasso</button>
            <button onClick={() => setOrdina("servizi")} className="ff-sans text-[11px] px-2.5 py-1.5" style={{ backgroundColor: ordina === "servizi" ? pine : "transparent", color: ordina === "servizi" ? paper : muted }}>Per frequenza</button>
          </div>
        </div>
        <div className="flex flex-col gap-2.5 overflow-y-auto pr-1" style={{ maxHeight: 210 }}>
          {classifica.map((c, i) => (
            <div key={c.id} className="flex items-center gap-2.5">
              <span className="ff-serif text-sm w-4" style={{ color: faint }}>{i + 1}</span>
              <div className="flex-1">
                <div className="flex items-center justify-between mb-1 flex-wrap gap-1">
                  <span className="ff-sans text-xs" style={{ color: ink }}>{c.nome}</span>
                  <span className="ff-sans text-[11px] font-medium" style={{ color: muted }}>{ordina === "incasso" ? `€${c.incassoTotale}` : `${c.serviziTotali} prenotazioni`}</span>
                </div>
                <div className="w-full h-1.5 rounded-full" style={{ backgroundColor: "#E7E2D2" }}><div className="h-1.5 rounded-full" style={{ width: `${((ordina === "incasso" ? c.incassoTotale : c.serviziTotali) / maxValore) * 100}%`, backgroundColor: gold }} /></div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <button onClick={() => setImpostazioniAperte(true)} className="w-full rounded-2xl p-4 flex items-center gap-3 text-left transition-all duration-200 hover:shadow-md hover:-translate-y-0.5" style={{ backgroundColor: card, boxShadow: shadowSm }}>
        <span className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: "#F2EFE6" }}>
          <Settings size={16} color={gold} />
        </span>
        <div className="flex-1">
          <p className="ff-sans text-sm font-medium" style={{ color: ink }}>Impostazioni</p>
          <p className="ff-sans text-xs mt-0.5" style={{ color: faint }}>Prezzi di default per servizio, specie o animale</p>
        </div>
        <ChevronRight size={16} color={faint} />
      </button>

      {giornoSelezionato && (
        <ModaleGiorno iso={giornoSelezionato} appuntamenti={appuntamenti} animali={animali} clienti={clienti}
          onClose={() => setGiornoSelezionato(null)} onApriModifica={(a) => { setGiornoSelezionato(null); onApriModifica(a); }} />
      )}

      {impostazioniAperte && (
        <ModaleImpostazioniPrezzi tariffeDefault={tariffeDefault} animali={animali}
          onAggiungiRegola={onAggiungiTariffaDefault} onRimuoviRegola={onRimuoviTariffaDefault}
          onClose={() => setImpostazioniAperte(false)} />
      )}
    </div>
  );
}

// ---------- Modale Cliente & Animale (nuovo / modifica) ----------
function ModaleClienteAnimale({ animaleEsistente, clienteEsistente, animaliTutti, clientiTutti, onClose, onSalva }) {
  const isNuovo = !animaleEsistente;
  const [foto, setFoto] = useState(animaleEsistente?.foto || null);
  const [nomeAnimale, setNomeAnimale] = useState(animaleEsistente?.nome || "");
  const [specie, setSpecie] = useState(animaleEsistente?.specie || "cane");
  const [sesso, setSesso] = useState(animaleEsistente?.sesso || "M");
  const [razza, setRazza] = useState(animaleEsistente?.razza || "");
  const [taglia, setTaglia] = useState(animaleEsistente?.taglia || "");
  const [eta, setEta] = useState(animaleEsistente?.eta || "");
  const [temperamento, setTemperamento] = useState(animaleEsistente?.temperamento || []);
  const [tagCustom, setTagCustom] = useState("");
  const [incompatSpecifiche, setIncompatSpecifiche] = useState(animaleEsistente?.incompatibile || []);
  const [farmaci, setFarmaci] = useState(animaleEsistente?.farmaci?.length ? animaleEsistente.farmaci : []);
  const [noteTesto, setNoteTesto] = useState(animaleEsistente?.note || "");
  const [allergie, setAllergie] = useState(() => {
  const raw = animaleEsistente?.allergie;
  if (!raw || raw === "nessuna nota") return [];
  return raw.split(",").map((s) => s.trim()).filter(Boolean);
});


  const [nomeCliente, setNomeCliente] = useState(clienteEsistente?.nome || "");
  const [telefonoCliente, setTelefonoCliente] = useState(clienteEsistente?.telefono || "");
  const [indirizzoCliente, setIndirizzoCliente] = useState(clienteEsistente?.indirizzo || "");

  const fileInputRef = useRef(null);

  // Comprime l'immagine nel browser PRIMA di caricarla: ridimensiona al massimo a 800px di lato
  // e la converte in JPEG qualità 80%. Una foto iPhone da 4-8MB diventa tipicamente 150-300KB,
  // senza perdita percettibile di qualità per l'uso come icona/avatar.
  const comprimiImmagine = (file) => {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const MAX_LATO = 800;
        let { width, height } = img;
        if (width > height && width > MAX_LATO) { height *= MAX_LATO / width; width = MAX_LATO; }
        else if (height > MAX_LATO) { width *= MAX_LATO / height; height = MAX_LATO; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.8);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  };

  const handleFoto = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const blobCompresso = await comprimiImmagine(file);
      const nomeFile = `${Date.now()}.jpg`;
      const { data, error } = await sb.storage.from("foto-animali").upload(nomeFile, blobCompresso, {
        cacheControl: "3600", upsert: false, contentType: "image/jpeg",
      });
      if (error) { console.error(error); alert("Errore nel caricamento della foto. Riprova."); return; }
      const { data: pub } = sb.storage.from("foto-animali").getPublicUrl(data.path);
      setFoto(pub.publicUrl);
    } catch (err) {
      console.error(err);
      alert("Errore nell'elaborazione della foto. Riprova con un'altra immagine.");
    }
  };


  const toggleTemperamento = (t) => setTemperamento((prev) => prev.includes(t) ? prev.filter((x) => x !== t) : [...prev, t]);
  const aggiungiTagCustom = () => {
    const v = tagCustom.trim();
    if (v && !temperamento.includes(v)) setTemperamento((prev) => [...prev, v]);
    setTagCustom("");
  };
  const aggiungiRegolaIncompat = (regola) => setIncompatSpecifiche((prev) => {
  if (prev.some((r) => chiaveRegola(r) === chiaveRegola(regola))) return prev;
  return [...prev, regola];
});
const rimuoviRegolaIncompat = (index) => setIncompatSpecifiche((prev) => prev.filter((_, i) => i !== index));
const setFiltroPerSpecieIncompat = (specie, regolaOrNull) => setIncompatSpecifiche((prev) => {
  const filtrati = prev.filter((r) => !(typeof r !== "number" && r.tipo === "filtro" && r.specie === specie));
  return regolaOrNull ? [...filtrati, regolaOrNull] : filtrati;
});

  const aggiungiFarmaco = () => setFarmaci((prev) => [...prev, { nome: "", orario: "" }]);
const aggiornaFarmaco = (i, campo, val) => setFarmaci((prev) => prev.map((f, idx) => idx === i ? { ...f, [campo]: val } : f));
const rimuoviFarmaco = (i) => setFarmaci((prev) => prev.filter((_, idx) => idx !== i));

const aggiungiAllergia = () => setAllergie((prev) => [...prev, ""]);
const aggiornaAllergia = (i, val) => setAllergie((prev) => prev.map((al, idx) => idx === i ? val : al));
const rimuoviAllergia = (i) => setAllergie((prev) => prev.filter((_, idx) => idx !== i));

  const handleSalva = () => {
  if (!nomeAnimale.trim() || !nomeCliente.trim()) return;
  const allergieTesto = allergie.map((a) => a.trim()).filter(Boolean).join(", ");
  const datiAnimale = {
    nome: nomeAnimale.trim(), specie, sesso, razza, taglia, eta, foto,
    temperamento, allergie: allergieTesto || "nessuna nota", farmaci: farmaci.filter((f) => f.nome.trim()),
    note: noteTesto, incompatibile: incompatSpecifiche,
  };
  const datiCliente = { nome: nomeCliente.trim(), telefono: telefonoCliente, indirizzo: indirizzoCliente };
  onSalva(datiCliente, datiAnimale, animaleEsistente?.id, clienteEsistente?.id);
};


  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4" style={{ backgroundColor: "rgba(28,32,24,0.45)" }}>
      <div className="ff-sans w-full max-w-md rounded-2xl p-5 sm:p-6 max-h-[92vh] overflow-y-auto" style={{ backgroundColor: card }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="ff-serif text-xl" style={{ color: ink }}>{isNuovo ? "Nuovo cliente & animale" : "Modifica anagrafica"}</h3>
          <button onClick={onClose}><X size={18} color={faint} /></button>
        </div>

        <div className="flex items-center gap-3 mb-4">
          <button type="button" onClick={() => fileInputRef.current?.click()} className="relative">
            <Avatar foto={foto} size={56} />
            <span className="absolute -bottom-1 -right-1 w-6 h-6 rounded-full flex items-center justify-center" style={{ backgroundColor: gold }}><Camera size={12} color="#2A1C05" /></span>
          </button>
          <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleFoto} />
          <p className="ff-sans text-xs" style={{ color: faint }}>Tocca per aggiungere<br/>una foto (opzionale)</p>
        </div>

        <Field label="Nome animale *">
          <input className={inputStyle} style={inputBg} value={nomeAnimale} onChange={(e) => setNomeAnimale(e.target.value)} placeholder="Es. Argo" />
        </Field>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Specie">
            <select className={inputStyle} style={inputBg} value={specie} onChange={(e) => setSpecie(e.target.value)}>
              <option value="cane">Cane</option>
              <option value="gatto">Gatto</option>
            </select>
          </Field>
          <Field label="Sesso">
            <select className={inputStyle} style={inputBg} value={sesso} onChange={(e) => setSesso(e.target.value)}>
              <option value="M">Maschio</option>
              <option value="F">Femmina</option>
            </select>
          </Field>
        </div>

        {/* Razza (più lunga), Taglia (media), Età (più corta/quadrata) sulla stessa riga. */}
        <div className="grid gap-2" style={{ gridTemplateColumns: "2fr 1.3fr 1fr" }}>
          <Field label="Razza"><input className={inputStyle} style={inputBg} value={razza} onChange={(e) => setRazza(e.target.value)} /></Field>
          <Field label="Taglia">
            <select className={inputStyle} style={inputBg} value={taglia} onChange={(e) => setTaglia(e.target.value)}>
              <option value="">—</option>
              <option value="Piccola">Piccola</option>
              <option value="Media">Media</option>
              <option value="Grande">Grande</option>
            </select>
          </Field>
          <Field label="Età"><input className={inputStyle} style={inputBg} value={eta} onChange={(e) => setEta(e.target.value)} /></Field>
        </div>

        {/* Allergie: pulsante "aggiungi", un campo testo per riga.
            Verrà mostrata in anagrafica come chip sottile corallo ("allergia: ..."). */}
        <div className="mb-3">
          <div className="flex items-center justify-between mb-1.5">
            <span className="ff-sans text-xs font-medium" style={{ color: muted }}>Allergie</span>
            <button type="button" onClick={aggiungiAllergia} className="ff-sans text-xs flex items-center gap-1" style={{ color: gold }}><Plus size={12} /> aggiungi</button>
          </div>
          {allergie.length === 0 && <p className="ff-sans text-xs" style={{ color: faint }}>Nessuna</p>}
          {allergie.map((al, i) => (
            <div key={i} className="flex gap-1.5 mb-1.5">
              <input className={inputStyle} style={inputBg} placeholder="Es. pollo" value={al} onChange={(e) => aggiornaAllergia(i, e.target.value)} />
              <button type="button" onClick={() => rimuoviAllergia(i)} className="px-2 shrink-0"><Trash size={14} color={coral} /></button>
            </div>
          ))}
        </div>

        {/* Farmaci: nome + orario a due dropdown separati (ore/minuti), vuoto di default. */}
        <div className="mb-3">
          <div className="flex items-center justify-between mb-1.5">
            <span className="ff-sans text-xs font-medium" style={{ color: muted }}>Farmaci</span>
            <button type="button" onClick={aggiungiFarmaco} className="ff-sans text-xs flex items-center gap-1" style={{ color: gold }}><Plus size={12} /> aggiungi</button>
          </div>
          {farmaci.length === 0 && <p className="ff-sans text-xs" style={{ color: faint }}>Nessuno</p>}
          {farmaci.map((f, i) => (
            <div key={i} className="flex gap-1.5 mb-1.5 items-start">
              <input className={inputStyle} style={{ ...inputBg, flex: 1 }} placeholder="Nome farmaco" value={f.nome} onChange={(e) => aggiornaFarmaco(i, "nome", e.target.value)} />
              <div style={{ width: 128 }} className="shrink-0">
                <OrarioFarmacoSelect value={f.orario} onChange={(v) => aggiornaFarmaco(i, "orario", v)} />
              </div>
              <button type="button" onClick={() => rimuoviFarmaco(i)} className="px-2 shrink-0"><Trash size={14} color={coral} /></button>
            </div>
          ))}
        </div>

        <Field label="Non affiancare a">
  <IncompatibilitaBuilder animali={animaliTutti} clienti={clientiTutti} escludiId={animaleEsistente?.id} selezionati={incompatSpecifiche}
    onSetFiltroPerSpecie={setFiltroPerSpecieIncompat} onAggiungiRegola={aggiungiRegolaIncompat} onRimuoviRegola={rimuoviRegolaIncompat} />
</Field>

        <Field label="Carattere / temperamento">
          <div className="flex flex-wrap gap-1.5 mb-2">
            {TEMPERAMENTI_PRESET.map((t) => (<TagToggle key={t} label={t} tono="sage" attivo={temperamento.includes(t)} onClick={() => toggleTemperamento(t)} />))}
          </div>
          <div className="flex gap-1.5">
            <input className={inputStyle} style={inputBg} value={tagCustom} placeholder="Aggiungi tag personalizzato…" onChange={(e) => setTagCustom(e.target.value)} onKeyDown={(e) => e.key === "Enter" && aggiungiTagCustom()} />
            <button type="button" onClick={aggiungiTagCustom} className="px-3 rounded-lg shrink-0" style={{ backgroundColor: sage }}><Plus size={14} color="#fff" /></button>
          </div>
          {temperamento.filter((t) => !TEMPERAMENTI_PRESET.includes(t)).length > 0 && (
            <div className="flex flex-wrap gap-1.5 mt-2">
              {temperamento.filter((t) => !TEMPERAMENTI_PRESET.includes(t)).map((t) => (<TagToggle key={t} label={t} tono="sage" attivo onClick={() => toggleTemperamento(t)} />))}
            </div>
          )}
        </Field>

        <Field label="Note">
          <textarea className={inputStyle} style={{ ...inputBg, minHeight: 56, resize: "vertical" }} value={noteTesto} onChange={(e) => setNoteTesto(e.target.value)} placeholder="Es. guinzaglio corto, adora l'acqua…" />
        </Field>

        <div className="pt-4 mt-2" style={{ borderTop: "1px solid #E4E0D0" }}>
          <p className="ff-sans text-xs font-medium mb-2.5" style={{ color: muted }}>Dati del proprietario</p>
          <Field label="Nome proprietario *"><input className={inputStyle} style={inputBg} value={nomeCliente} onChange={(e) => setNomeCliente(e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Telefono"><input className={inputStyle} style={inputBg} value={telefonoCliente} onChange={(e) => setTelefonoCliente(e.target.value)} /></Field>
            <Field label="Indirizzo"><input className={inputStyle} style={inputBg} value={indirizzoCliente} onChange={(e) => setIndirizzoCliente(e.target.value)} /></Field>
          </div>
        </div>

        <button onClick={handleSalva} className="ff-sans text-sm font-semibold px-5 py-2.5 rounded-xl w-full mt-3 transition-all duration-200" style={{ backgroundColor: gold, color: "#2A1C05", boxShadow: shadowGoldGlow }}>
          {isNuovo ? "Crea cliente & animale" : "Salva modifiche"}
        </button>
      </div>
    </div>
  );
}

// ---------- Modale Appuntamento ----------
function ModaleAppuntamento({ esistente, dataDefault, clienti, animali, appuntamenti, onClose, onSalva, onAnnullaApp, onNuovoCliente, tariffeDefault = [] }) {
  const isNuovo = !esistente;
  const animaleEsistente = esistente ? animaleById(animali, esistente.animaleId) : null;
  const clienteEsistente = animaleEsistente ? clienteById(clienti, animaleEsistente.clienteId) : null;

  const [query, setQuery] = useState(isNuovo ? "" : `${animaleEsistente.nome} (${clienteEsistente.nome})`);
  const [selAnimaleId, setSelAnimaleId] = useState(esistente ? esistente.animaleId : null);
  const [creaNuovo, setCreaNuovo] = useState(false);
  const [nuovoCliente, setNuovoCliente] = useState({ nomeCliente: "", nomeAnimale: "", specieAnimale: "cane", telefono: "", incompatSpecifiche: [] });

  const [tipo, setTipo] = useState(esistente?.tipo || "Passeggiata");

  // Richiesta 1: SEMPRE la data odierna reale, ricalcolata a ogni apertura della finestra.
  // Nessuna data hardcoded o residua da utilizzi precedenti: usiamo sempre una chiamata fresca a oggiAdesso().
  const dataOggiFresca = useMemo(() => toISO(oggiAdesso()), []);
  const oraFrescaIniziale = useMemo(() => nearestFiveMinutes(oggiAdesso()), []);

  const [dataRitiro, setDataRitiro] = useState(esistente?.dataRitiro || dataDefault || dataOggiFresca);
  const [oraRitiro, setOraRitiro] = useState(esistente?.oraRitiro || oraFrescaIniziale);
  const [dataRiconsegna, setDataRiconsegna] = useState(esistente?.dataRiconsegna || dataDefault || dataOggiFresca);
  const [oraRiconsegna, setOraRiconsegna] = useState(esistente?.oraRiconsegna || addMinutesToTime(esistente?.oraRitiro || oraFrescaIniziale, 40));
  const [nota, setNota] = useState(esistente?.nota || "");

  const [durataMinuti, setDurataMinuti] = useState(() => {
    if (esistente && esistente.tipo !== "Pensione") return diffMinutiTime(esistente.oraRitiro, esistente.oraRiconsegna) || 40;
    return 40;
  });
  const [mostraOrarioFineManuale, setMostraOrarioFineManuale] = useState(false);
  const [confermaAnnullaAperta, setConfermaAnnullaAperta] = useState(false);


  // Giorni di soggiorno (solo Pensione): fonte di verità per la data di riconsegna.
  const [giorniSoggiorno, setGiorniSoggiorno] = useState(() => {
    if (esistente && esistente.tipo === "Pensione") return giorniTra(esistente.dataRitiro, esistente.dataRiconsegna);
    return 1;
  });
  const [modificaTariffa, setModificaTariffa] = useState(false);

  const [tariffaGiorno, setTariffaGiorno] = useState(() => esistente?.tariffaGiorno ?? trovaPrezzoDefault(tariffeDefault, esistente?.tipo || "Passeggiata", null));
  const [tariffaTotale, setTariffaTotale] = useState(() => esistente?.tariffaTotale ?? trovaPrezzoDefault(tariffeDefault, esistente?.tipo || "Passeggiata", null));

  // Buffer testuali per i campi tariffa: evitano che, svuotando il campo per digitare un nuovo
  // valore, lo stato numerico diventi 0 e faccia ricomparire uno zero davanti al numero scritto.
  const [tariffaGiornoStr, setTariffaGiornoStr] = useState(String(tariffaGiorno));
  const [tariffaTotaleStr, setTariffaTotaleStr] = useState(String(tariffaTotale));
  useEffect(() => { setTariffaGiornoStr(String(tariffaGiorno)); }, [tariffaGiorno]);
  useEffect(() => { setTariffaTotaleStr(String(tariffaTotale)); }, [tariffaTotale]);


  const [conflitti, setConflitti] = useState(null);
  const [candidatoPending, setCandidatoPending] = useState(null);

  const lbl = etichetteServizio(tipo);

  const giorniCalcolati = tipo === "Pensione" ? giorniSoggiorno : giorniTra(dataRitiro, dataRiconsegna);

  const primoRender = useRef(true);
  useEffect(() => {
    if (primoRender.current) { primoRender.current = false; return; }
    if (tipo === "Pensione") setTariffaTotale(Math.round(tariffaGiorno * giorniCalcolati * 100) / 100);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [giorniCalcolati]);

  const handleTariffaGiorno = (v) => { setTariffaGiorno(v); setTariffaTotale(tipo === "Pensione" ? Math.round(v * giorniCalcolati * 100) / 100 : v); };
  const handleTariffaTotale = (v) => { setTariffaTotale(v); if (tipo === "Pensione") setTariffaGiorno(Math.round((v / giorniCalcolati) * 100) / 100); };

  const handleOraRitiroChange = (nuovo) => {
    setOraRitiro(nuovo);
    if (tipo !== "Pensione") setOraRiconsegna(addMinutesToTime(nuovo, durataMinuti));
  };
  const handleDurata = (nuovaDurata) => {
    const d = Math.max(10, nuovaDurata);
    setDurataMinuti(d);
    setOraRiconsegna(addMinutesToTime(oraRitiro, d));
  };
  const handleOraRiconsegnaManuale = (nuovo) => {
    setOraRiconsegna(nuovo);
    setDurataMinuti(diffMinutiTime(oraRitiro, nuovo));
  };

  // Giorni di soggiorno: pulsanti -/+ e digitazione diretta ricalcolano immediatamente la data di riconsegna.
  const applicaGiorniSoggiorno = (nuoviGiorni) => {
    const g = Math.max(1, nuoviGiorni);
    setGiorniSoggiorno(g);
    setDataRiconsegna(toISO(addDays(fromISO(dataRitiro), g - 1)));
  };

  const handleDataRitiroChange = (nuovaData) => {
    setDataRitiro(nuovaData);
    if (tipo === "Pensione") {
      setDataRiconsegna(toISO(addDays(fromISO(nuovaData), giorniSoggiorno - 1)));
    } else {
      setDataRiconsegna(nuovaData);
    }
  };

  const handleDataRiconsegnaManuale = (nuovaData) => {
    setDataRiconsegna(nuovaData);
    const g = giorniTra(dataRitiro, nuovaData);
    setGiorniSoggiorno(g);
  };

  const handleTipoChange = (nuovoTipo) => {
    setTipo(nuovoTipo);
    // "giorniPerCalcolo" evita di usare il valore VECCHIO di giorniSoggiorno (es. 5) mentre
    // lo stiamo resettando a 1 — setGiorniSoggiorno è asincrono, senza questa variabile locale
    // il totale verrebbe calcolato un istante con i giorni sbagliati.
    let giorniPerCalcolo = giorniSoggiorno;
    if (nuovoTipo !== "Pensione") {
      setDataRiconsegna(dataRitiro);
      setOraRiconsegna(addMinutesToTime(oraRitiro, durataMinuti));
    } else {
      giorniPerCalcolo = 1;
      setGiorniSoggiorno(1);
      setDataRiconsegna(dataRitiro);
    }
    const animaleRif = selAnimaleId ? animaleById(animali, selAnimaleId) : (creaNuovo ? { specie: nuovoCliente.specieAnimale } : null);
    const prezzo = trovaPrezzoDefault(tariffeDefault, nuovoTipo, animaleRif);
    setTariffaGiorno(prezzo);
    setTariffaTotale(nuovoTipo === "Pensione" ? Math.round(prezzo * giorniPerCalcolo * 100) / 100 : prezzo);
  };


  const aggiungiIncompatQuickCreate = (regola) => setNuovoCliente((prev) => {
  if (prev.incompatSpecifiche.some((r) => chiaveRegola(r) === chiaveRegola(regola))) return prev;
  return { ...prev, incompatSpecifiche: [...prev.incompatSpecifiche, regola] };
});
const rimuoviIncompatQuickCreate = (index) => setNuovoCliente((prev) => ({
  ...prev, incompatSpecifiche: prev.incompatSpecifiche.filter((_, i) => i !== index),
}));
const setFiltroPerSpecieQuickCreate = (specie, regolaOrNull) => setNuovoCliente((prev) => {
  const filtrati = prev.incompatSpecifiche.filter((r) => !(typeof r !== "number" && r.tipo === "filtro" && r.specie === specie));
  return { ...prev, incompatSpecifiche: regolaOrNull ? [...filtrati, regolaOrNull] : filtrati };
});


  // Punto 4: esclude dagli autocompletamenti gli animali di clienti disattivati ("eliminati"),
  // così non è più possibile creare nuovi appuntamenti per clienti rimossi dalle liste operative.
  // Il controllo "!c" protegge anche da eventuali dati incoerenti (animale senza cliente collegato).
  // Punto 4: esclude dagli autocompletamenti gli animali di clienti disattivati ("eliminati"),
  // così NON è più possibile prenotare per un cliente con attivo:false. Il controllo "!c"
  // protegge anche da eventuali dati incoerenti (animale senza cliente collegato).
  // Ordinamento alfabetico per nome animale, coerente con le altre liste dell'app.
  const suggerimenti = isNuovo && query && !selAnimaleId
    ? animali.filter((a) => {
        const c = clienteById(clienti, a.clienteId);
        if (!c || c.attivo === false) return false;
        return a.nome.toLowerCase().includes(query.toLowerCase()) || c.nome.toLowerCase().includes(query.toLowerCase());
      }).sort((x, y) => x.nome.localeCompare(y.nome))
    : [];


  const indirizzoVisualizzato = isNuovo
    ? (selAnimaleId ? clienteById(clienti, animaleById(animali, selAnimaleId).clienteId).indirizzo : null)
    : clienteEsistente.indirizzo;

  const costruisciCandidato = () => {
    let clienteId = clienteEsistente?.id, animaleId = selAnimaleId;
    if (isNuovo) {
      if (creaNuovo && nuovoCliente.nomeCliente && nuovoCliente.nomeAnimale) { return null; }
      else if (selAnimaleId) { const a = animaleById(animali, selAnimaleId); clienteId = a.clienteId; animaleId = a.id; }
      else { return null; }
    }
    const dateCambiate = esistente && (esistente.dataRitiro !== dataRitiro || esistente.dataRiconsegna !== dataRiconsegna);
    return {
      id: esistente?.id, clienteId, animaleId, tipo, dataRitiro, oraRitiro, dataRiconsegna, oraRiconsegna,
      tariffaGiorno, tariffaTotale, nota, conflitto: false,
      stato: dateCambiate ? "rimandato" : (esistente?.stato === "annullato" ? "annullato" : "confermato"),
    };
  };

  const handleSalva = async () => {
    if (isNuovo && creaNuovo && nuovoCliente.nomeCliente && nuovoCliente.nomeAnimale) {
      const nuovi = await onNuovoCliente(nuovoCliente);
      if (!nuovi) {
        alert("Errore durante la creazione del nuovo cliente. Apri la Console del browser (F12) per i dettagli.");
        return;
      }
      const candidato = { id: undefined, clienteId: nuovi.clienteId, animaleId: nuovi.animaleId, tipo, dataRitiro, oraRitiro, dataRiconsegna, oraRiconsegna, tariffaGiorno, tariffaTotale, nota, conflitto: false, stato: "confermato" };
      const animaleFittizio = { id: nuovi.animaleId, clienteId: nuovi.clienteId, nome: nuovoCliente.nomeAnimale, specie: nuovoCliente.specieAnimale || "cane", sesso: "M", incompatibile: nuovoCliente.incompatSpecifiche || [] };
      const animaliPerConflitto = [...animali, animaleFittizio];
      const trovati = rilevaConflitti(candidato, appuntamenti, animaliPerConflitto);
      if (trovati.length > 0) { setConflitti(trovati); setCandidatoPending(candidato); } else onSalva(candidato);
      return;
    }
    const candidato = costruisciCandidato();
    if (!candidato) return;
    const trovati = rilevaConflitti(candidato, appuntamenti, animali);
    if (trovati.length > 0) { setConflitti(trovati); setCandidatoPending(candidato); } else onSalva(candidato);
  };

  if (conflitti) {
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ backgroundColor: "rgba(20,24,17,0.55)", backdropFilter: "blur(6px) saturate(140%)", WebkitBackdropFilter: "blur(6px) saturate(140%)" }}>
        <div className="ff-sans w-full max-w-md rounded-[28px] p-5 sm:p-6 modal-enter" style={{ backgroundColor: card, boxShadow: shadowLg }}>

          <div className="flex items-center gap-2.5 mb-3">
            <AlertTriangle size={20} color={coral} />
            <h3 className="ff-serif text-xl" style={{ color: ink }}>Possibile sovrapposizione</h3>
          </div>
          <div className="flex flex-col gap-2 mb-5 max-h-72 overflow-y-auto">
            {conflitti.map((c, i) => (
              <div key={i} className="rounded-xl px-3.5 py-2.5 text-sm flex items-start gap-2"
                style={{ backgroundColor: c.tipo === "compatibilita" ? "#F0D2C6" : "#FBF3E2", color: c.tipo === "compatibilita" ? coral : "#5C3F13" }}>
                {c.tipo === "compatibilita" ? <PawPrint size={14} className="mt-0.5 shrink-0" /> : <Clock size={14} className="mt-0.5 shrink-0" />}
                {c.messaggio}
              </div>
            ))}
          </div>
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <button onClick={() => { setConflitti(null); setCandidatoPending(null); }} className="ff-sans text-sm px-4 py-2.5 rounded-xl" style={{ backgroundColor: "#F2EFE6", color: muted }}>← Torna a modificare</button>
            <button onClick={() => onSalva({ ...candidatoPending, conflitto: true })} className="ff-sans text-sm font-medium px-4 py-2.5 rounded-xl" style={{ backgroundColor: coral, color: "#fff" }}>Conferma comunque</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4" style={{ backgroundColor: "rgba(28,32,24,0.45)" }}>
      <div className="ff-sans w-full max-w-md rounded-2xl p-5 sm:p-6 max-h-[92vh] overflow-y-auto" style={{ backgroundColor: card }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="ff-serif text-xl" style={{ color: ink }}>{isNuovo ? "Nuovo appuntamento" : "Modifica appuntamento"}</h3>
          <button onClick={onClose}><X size={18} color={faint} /></button>
        </div>

        {isNuovo ? (
          <Field label="Cliente / Animale">
            {!creaNuovo ? (
              <>
                <div className="relative">
                  <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2" color={faint} />
                  <input className={inputStyle + " pl-8"} style={inputBg} value={query} placeholder="Scrivi il nome del cane o del proprietario…"
                    onChange={(e) => { setQuery(e.target.value); setSelAnimaleId(null); }} />
                </div>
                {suggerimenti.length > 0 && (
                  <div className="mt-1.5 rounded-lg overflow-hidden" style={{ border: "1px solid #DDD8C6" }}>
                    {suggerimenti.map((a) => {
                      const c = clienteById(clienti, a.clienteId);
                      return (
                        <button key={a.id} type="button" className="w-full text-left px-3 py-2 text-sm hover:opacity-80" style={{ backgroundColor: "#F2EFE6", color: ink }}
                          onClick={() => {
                            setSelAnimaleId(a.id);
                            setQuery(`${a.nome} (${c.nome})`);
                            // Applica il prezzo di default più specifico disponibile per QUESTO animale.
                            const prezzo = trovaPrezzoDefault(tariffeDefault, tipo, a);
                            setTariffaGiorno(prezzo);
                            setTariffaTotale(tipo === "Pensione" ? Math.round(prezzo * giorniSoggiorno * 100) / 100 : prezzo);
                          }}>
                          {a.nome} <span style={{ color: faint }}>— {c.nome}</span>
                        </button>
                      );
                    })}
                  </div>
                )}

                {query && suggerimenti.length === 0 && !selAnimaleId && (
                  <button type="button" onClick={() => setCreaNuovo(true)} className="mt-1.5 text-sm flex items-center gap-1.5" style={{ color: gold }}><Plus size={14} /> Registra nuovo cliente "{query}"</button>
                )}
              </>
            ) : (
              <div className="rounded-lg p-3 space-y-2.5" style={{ backgroundColor: "#F2EFE6" }}>
                <input className={inputStyle} style={inputBg} placeholder="Nome proprietario" value={nuovoCliente.nomeCliente} onChange={(e) => setNuovoCliente({ ...nuovoCliente, nomeCliente: e.target.value })} />
                <input className={inputStyle} style={inputBg} placeholder="Nome animale" value={nuovoCliente.nomeAnimale} onChange={(e) => setNuovoCliente({ ...nuovoCliente, nomeAnimale: e.target.value })} />
                <select className={inputStyle} style={inputBg} value={nuovoCliente.specieAnimale} onChange={(e) => {
                  const nuovaSpecie = e.target.value;
                  setNuovoCliente({ ...nuovoCliente, specieAnimale: nuovaSpecie });
                  // Nuovo cliente creato al volo: applica il prezzo di default per quella specie.
                  const prezzo = trovaPrezzoDefault(tariffeDefault, tipo, { specie: nuovaSpecie });
                  setTariffaGiorno(prezzo);
                  setTariffaTotale(tipo === "Pensione" ? Math.round(prezzo * giorniSoggiorno * 100) / 100 : prezzo);
                }}>
                  <option value="cane">Cane</option>
                  <option value="gatto">Gatto</option>
                </select>
<input className={inputStyle} style={inputBg} placeholder="Telefono" value={nuovoCliente.telefono} onChange={(e) => setNuovoCliente({ ...nuovoCliente, telefono: e.target.value })} />
                <div className="pt-1">
                  <span className="ff-sans text-xs font-medium block mb-1.5" style={{ color: coral }}>Non affiancare a:</span>
                  <IncompatibilitaBuilder animali={animali} clienti={clienti} selezionati={nuovoCliente.incompatSpecifiche}
  onSetFiltroPerSpecie={setFiltroPerSpecieQuickCreate} onAggiungiRegola={aggiungiIncompatQuickCreate} onRimuoviRegola={rimuoviIncompatQuickCreate} />
                </div>
                <button type="button" onClick={() => setCreaNuovo(false)} className="text-xs" style={{ color: faint }}>← torna alla ricerca</button>
                <p className="text-[11px]" style={{ color: faint }}>Potrai completare razza, temperamento, foto e altri dettagli più tardi dalla sezione Clienti & Animali.</p>
              </div>
            )}
            {indirizzoVisualizzato && !creaNuovo && (<p className="text-xs flex items-center gap-1 mt-1.5" style={{ color: faint }}><MapPin size={11} /> {indirizzoVisualizzato} <span style={{ color: "#B7B39F" }}>(da anagrafica)</span></p>)}
          </Field>
        ) : (
          <div className="rounded-lg px-3.5 py-2.5 mb-4" style={{ backgroundColor: "#F2EFE6" }}>
            <p className="text-sm font-medium" style={{ color: ink }}>{animaleEsistente.nome} — {clienteEsistente.nome}</p>
            <p className="text-xs mt-1 flex items-center gap-1" style={{ color: faint }}><MapPin size={11} /> {indirizzoVisualizzato}</p>
            {/* Richiesta 11: tipologia servizio visibile, leggibile, NON modificabile in modalità modifica. */}
            <div className="mt-2 pt-2 flex items-center gap-1.5" style={{ borderTop: "1px solid #E4E0D0" }}>
              <span className="ff-sans text-[11px]" style={{ color: faint }}>Servizio:</span>
              <span className="ff-sans text-xs font-medium px-2 py-0.5 rounded-full" style={{ backgroundColor: coloriServizio(tipo).bg, color: ink }}>{tipo}</span>
            </div>
          </div>
        )}

        {isNuovo && (
          <Field label="Tipo di servizio">
            <select className={inputStyle} style={inputBg} value={tipo} onChange={(e) => handleTipoChange(e.target.value)}>
              <option>Passeggiata</option>
              <option>Visita domiciliare</option>
              <option>Pensione</option>
            </select>
          </Field>
        )}

        {tipo === "Pensione" ? (
          <>
            {/* Riga 1: Data di ritiro + Ora di ritiro — affiancati anche su mobile. Richiesta 1: sempre data odierna fresca, mai hardcoded. */}
            <div className="grid grid-cols-2 gap-3">
              <Field label="Data di ritiro"><DateField value={dataRitiro} onChange={handleDataRitiroChange} /></Field>
              <Field label="Ora di ritiro"><TimeSelect value={oraRitiro} onChange={setOraRitiro} /></Field>
            </div>

            {/* Riga 2: Data di riconsegna + Ora di riconsegna — SEMPRE editabili (richiesta 4) */}
           <div className="grid grid-cols-2 gap-3">
              <Field label="Data di riconsegna">
                <DateField value={dataRiconsegna} onChange={handleDataRiconsegnaManuale} min={dataRitiro} />
              </Field>
              <Field label="Ora di riconsegna"><TimeSelect value={oraRiconsegna} onChange={setOraRiconsegna} /></Field>
            </div>

            <div className="mb-4">
              <GiorniSoggiornoEditor giorni={giorniSoggiorno} onChange={applicaGiorniSoggiorno} />
            </div>
          </>
        ) : (
          <>
            {/* Richiesta 5: etichette dinamiche Inizio/Fine per Passeggiata e Visita domiciliare */}
            <div className="grid grid-cols-2 gap-3">
              <Field label="Data"><DateField value={dataRitiro} onChange={handleDataRitiroChange} /></Field>
              <Field label={lbl.inizio}><TimeSelect value={oraRitiro} onChange={handleOraRitiroChange} /></Field>
            </div>
            <Field label="Durata">
              <DurataEditor minuti={durataMinuti} onChange={handleDurata} />
            </Field>
            <p className="ff-sans text-xs -mt-2 mb-3" style={{ color: faint }}>
              Fino alle <b style={{ color: ink }}>{oraRiconsegna}</b> ·{" "}
              <button type="button" onClick={() => setMostraOrarioFineManuale(!mostraOrarioFineManuale)} style={{ color: gold }}>
                {mostraOrarioFineManuale ? "nascondi" : `modifica orario di ${lbl.fine.toLowerCase()} manualmente`}
              </button>
            </p>
            {mostraOrarioFineManuale && (
              <Field label={`Orario di ${lbl.fine.toLowerCase()} (manuale)`}><TimeSelect value={oraRiconsegna} onChange={handleOraRiconsegnaManuale} /></Field>
            )}
          </>
        )}

        <div className="rounded-lg p-3.5 mt-1 mb-4" style={{ backgroundColor: "#F2EFE6" }}>
          <div className="flex items-center justify-between mb-2">
            <span className="ff-sans text-xs font-medium" style={{ color: muted }}>Tariffa {tipo === "Pensione" && giorniCalcolati > 1 ? `(${giorniCalcolati} giorni)` : ""}</span>
            {!isNuovo && (<button type="button" onClick={() => setModificaTariffa(!modificaTariffa)} className="text-xs flex items-center gap-1" style={{ color: gold }}><Pencil size={11} /> {modificaTariffa ? "blocca" : "modifica"}</button>)}
          </div>
          <div className="grid grid-cols-2 gap-3">
            <label className="block">
              <span className="text-[11px] block mb-1" style={{ color: faint }}>{tipo === "Pensione" ? "Giornaliera (€)" : "Tariffa (€)"}</span>
              <input
                type="text"
                inputMode="decimal"
                disabled={!isNuovo && !modificaTariffa}
                className={inputStyle}
                style={inputBg}
                value={tariffaGiornoStr}
                onChange={(e) => {
                  const v = e.target.value.replace(/[^0-9.]/g, "");
                  setTariffaGiornoStr(v);
                  if (v !== "" && !isNaN(Number(v))) handleTariffaGiorno(Number(v));
                }}
                onBlur={() => { if (tariffaGiornoStr === "") setTariffaGiornoStr(String(tariffaGiorno)); }}
              />
            </label>
            {tipo === "Pensione" && (
              <label className="block">
                <span className="text-[11px] block mb-1" style={{ color: faint }}>Totale (€)</span>
                <input
                  type="text"
                  inputMode="decimal"
                  disabled={!isNuovo && !modificaTariffa}
                  className={inputStyle}
                  style={inputBg}
                  value={tariffaTotaleStr}
                  onChange={(e) => {
                    const v = e.target.value.replace(/[^0-9.]/g, "");
                    setTariffaTotaleStr(v);
                    if (v !== "" && !isNaN(Number(v))) handleTariffaTotale(Number(v));
                  }}
                  onBlur={() => { if (tariffaTotaleStr === "") setTariffaTotaleStr(String(tariffaTotale)); }}
                />
              </label>
            )}
          </div>

        </div>

        <Field label="Nota per questo servizio">
          <textarea className={inputStyle} style={{ ...inputBg, minHeight: 64, resize: "vertical" }} value={nota} onChange={(e) => setNota(e.target.value)} />
        </Field>

        <div className="flex items-center justify-between mt-5 flex-wrap gap-3">
          {!isNuovo ? (<button onClick={() => setConfermaAnnullaAperta(true)} className="ff-sans text-sm flex items-center gap-1.5 px-3 py-2 rounded-lg" style={{ color: coral }}><Ban size={14} /> Annulla appuntamento</button>) : <span />}
          <button onClick={handleSalva} className="ff-sans text-sm font-semibold px-5 py-2.5 rounded-xl w-full sm:w-auto transition-all duration-200" style={{ backgroundColor: gold, color: "#2A1C05", boxShadow: shadowGoldGlow }}>{isNuovo ? "Salva appuntamento" : "Salva modifiche"}</button>

        </div>

        {confermaAnnullaAperta && (
          <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" style={{ backgroundColor: "rgba(20,24,17,0.55)", backdropFilter: "blur(6px) saturate(140%)", WebkitBackdropFilter: "blur(6px) saturate(140%)" }}>
            <div className="ff-sans w-full max-w-sm rounded-[28px] p-5 sm:p-6 modal-enter" style={{ backgroundColor: card, boxShadow: shadowLg }}>
              <div className="flex items-center gap-2.5 mb-3">
                <AlertTriangle size={20} color={coral} />
                <h3 className="ff-serif text-xl" style={{ color: ink }}>Confermi l'annullamento?</h3>
              </div>
              <p className="ff-sans text-sm mb-5" style={{ color: muted }}>Confermi di voler annullare questo appuntamento?</p>
              <div className="flex items-center justify-between gap-3 flex-wrap">
                <button onClick={() => setConfermaAnnullaAperta(false)} className="ff-sans text-sm px-4 py-2.5 rounded-xl" style={{ backgroundColor: "#F2EFE6", color: muted }}>Annulla</button>
                <button onClick={() => onAnnullaApp(esistente.id)} className="ff-sans text-sm font-medium px-4 py-2.5 rounded-xl" style={{ backgroundColor: coral, color: "#fff" }}>Conferma eliminazione</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Supabase: client + mapper camelCase (app) <-> snake_case (database) ----------
const { createClient } = supabase;
const sb = createClient("https://blkqjcwqslyqfgbbxzkw.supabase.co", "sb_publishable_suTun-BGxaR39dJyE_lTZA_ymIP-nra");
const clienteToDb = (c) => ({
  nome: c.nome, telefono: c.telefono, indirizzo: c.indirizzo,
  data_inizio: c.dataInizio, storico_servizi: c.storicoServizi, storico_incasso_totale: c.storicoIncassoTotale,
  attivo: c.attivo,
});
const clienteFromDb = (r) => ({
  id: r.id, nome: r.nome, telefono: r.telefono, indirizzo: r.indirizzo,
  dataInizio: r.data_inizio, storicoServizi: r.storico_servizi, storicoIncassoTotale: r.storico_incasso_totale,
  attivo: r.attivo,
});

const animaleToDb = (a) => ({
  cliente_id: a.clienteId, nome: a.nome, specie: a.specie, sesso: a.sesso, razza: a.razza,
  eta: a.eta, taglia: a.taglia, foto: a.foto, allergie: a.allergie, farmaci: a.farmaci,
  temperamento: a.temperamento, note: a.note, incompatibile: a.incompatibile,
});
const animaleFromDb = (r) => ({
  id: r.id, clienteId: r.cliente_id, nome: r.nome, specie: r.specie, sesso: r.sesso, razza: r.razza,
  eta: r.eta, taglia: r.taglia, foto: r.foto, allergie: r.allergie, farmaci: r.farmaci || [],
  temperamento: r.temperamento || [], note: r.note, incompatibile: r.incompatibile || [],
});

const appuntamentoToDb = (a) => ({
  cliente_id: a.clienteId, animale_id: a.animaleId, tipo: a.tipo,
  data_ritiro: a.dataRitiro, ora_ritiro: a.oraRitiro, data_riconsegna: a.dataRiconsegna, ora_riconsegna: a.oraRiconsegna,
  tariffa_giorno: a.tariffaGiorno, tariffa_totale: a.tariffaTotale, stato: a.stato, nota: a.nota, conflitto: a.conflitto,
});
const appuntamentoFromDb = (r) => ({
  id: r.id, clienteId: r.cliente_id, animaleId: r.animale_id, tipo: r.tipo,
  dataRitiro: r.data_ritiro, oraRitiro: r.ora_ritiro, dataRiconsegna: r.data_riconsegna, oraRiconsegna: r.ora_riconsegna,
  tariffaGiorno: r.tariffa_giorno, tariffaTotale: r.tariffa_totale, stato: r.stato, nota: r.nota, conflitto: r.conflitto,
});

const tariffaDefaultToDb = (t) => ({
  tipo: t.tipo, specie: t.specie || null, animale_id: t.animaleId || null, prezzo: t.prezzo,
});
const tariffaDefaultFromDb = (r) => ({
  id: r.id, tipo: r.tipo, specie: r.specie, animaleId: r.animale_id, prezzo: r.prezzo,
});

// ---------- App ----------
function App() {
  const [clienti, setClienti] = useState([]);
  const [animali, setAnimali] = useState([]);
  const [appuntamenti, setAppuntamenti] = useState([]);
  const [tariffeDefault, setTariffeDefault] = useState([]);
  const [caricamento, setCaricamento] = useState(true);
  const [erroreCaricamento, setErroreCaricamento] = useState(null);
  const [view, setView] = useState("oggi");
  const [modale, setModale] = useState(null);

  useEffect(() => {
    (async () => {
      const [rc, ra, rp, rt] = await Promise.all([
        sb.from("clienti").select("*"),
        sb.from("animali").select("*"),
        sb.from("appuntamenti").select("*"),
        sb.from("tariffe_default").select("*"),
      ]);
      if (rc.error || ra.error || rp.error || rt.error) {
        setErroreCaricamento("Impossibile contattare il database. Controlla la connessione e riprova.");
        setCaricamento(false);
        return;
      }
      if (rc.data) setClienti(rc.data.map(clienteFromDb));
      if (ra.data) setAnimali(ra.data.map(animaleFromDb));
      if (rp.data) setAppuntamenti(rp.data.map(appuntamentoFromDb));
      if (rt.data) setTariffeDefault(rt.data.map(tariffaDefaultFromDb));
      setCaricamento(false);
    })();
  }, []);

  // Sincronizzazione realtime (punto 5): se un altro dispositivo (o un'altra schermata della stessa
  // app) crea/modifica/elimina un record, lo stato locale si aggiorna da solo, senza ricaricare la
  // pagina. Per semplicità e robustezza, ad ogni cambiamento ricarichiamo per intero la tabella
  // coinvolta: il volume di dati di questa app è piccolo, il costo è del tutto trascurabile.
  useEffect(() => {
    const canale = sb.channel("sync-gestionale")
      .on("postgres_changes", { event: "*", schema: "public", table: "clienti" }, async () => {
        const { data } = await sb.from("clienti").select("*");
        if (data) setClienti(data.map(clienteFromDb));
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "animali" }, async () => {
        const { data } = await sb.from("animali").select("*");
        if (data) setAnimali(data.map(animaleFromDb));
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "appuntamenti" }, async () => {
        const { data } = await sb.from("appuntamenti").select("*");
        if (data) setAppuntamenti(data.map(appuntamentoFromDb));
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "tariffe_default" }, async () => {
        const { data } = await sb.from("tariffe_default").select("*");
        if (data) setTariffeDefault(data.map(tariffaDefaultFromDb));
      })
      .subscribe();

    return () => { sb.removeChannel(canale); };
  }, []);
  const [agendaMese, setAgendaMese] = useState(OGGI.getMonth());
  const [agendaAnno, setAgendaAnno] = useState(OGGI.getFullYear());
  const [agendaWeek, setAgendaWeek] = useState(MONDAY_CURRENT);

  const agendaSelezionaSettimana = (monday) => {
    setAgendaWeek(monday);
    const giovedi = addDays(monday, 3);
    setAgendaMese(giovedi.getMonth());
    setAgendaAnno(giovedi.getFullYear());
  };
  const agendaSelezionaMese = (mData) => {
    setAgendaMese(mData.getMonth());
    setAgendaAnno(mData.getFullYear());
    if (mData.getMonth() === OGGI.getMonth() && mData.getFullYear() === OGGI.getFullYear()) setAgendaWeek(MONDAY_CURRENT);
    else setAgendaWeek(mondayOf(new Date(mData.getFullYear(), mData.getMonth(), 1)));
  };

  // Ogni volta che si rientra nel tab Agenda, si riparte sempre dalla settimana odierna.
  useEffect(() => {
    if (view === "agenda") {
      setAgendaMese(OGGI.getMonth());
      setAgendaAnno(OGGI.getFullYear());
      setAgendaWeek(MONDAY_CURRENT);
    }
  }, [view]);

  const nav = [
    { key: "oggi", label: "Oggi", icon: Sun },
    { key: "agenda", label: "Agenda", icon: CalendarDays },
    { key: "clienti", label: "Clienti", icon: Users },
    { key: "dashboard", label: "Dashboard", icon: LayoutDashboard },
  ];

  // Richiesta 6: la nota del singolo appuntamento NON viene più propagata/accumulata
  // in animale.noteServizi. Resta visibile solo nella card "Prossimo impegno"/eventi del giorno
  // in VistaOggi (letta direttamente da appuntamento.nota).
  const handleSalva = async (dati) => {
    if (dati.id) {
      const { data, error } = await sb.from("appuntamenti").update(appuntamentoToDb(dati)).eq("id", dati.id).select().single();
      if (error) { console.error(error); return; }
      const salvato = appuntamentoFromDb(data);
      setAppuntamenti((prev) => prev.map((a) => a.id === salvato.id ? salvato : a));
    } else {
      const { data, error } = await sb.from("appuntamenti").insert(appuntamentoToDb(dati)).select().single();
      if (error) { console.error(error); return; }
      setAppuntamenti((prev) => [...prev, appuntamentoFromDb(data)]);
    }
    setModale(null);
  };


  const handleAnnulla = async (id) => {
    await sb.from("appuntamenti").update({ stato: "annullato" }).eq("id", id);
    setAppuntamenti((prev) => prev.map((a) => a.id === id ? { ...a, stato: "annullato" } : a));
    setModale(null);
  };

  // Punto 4: "eliminare" un cliente NON cancella mai la riga dal database — la disattiva soltanto
  // (attivo: false). Così il cliente scompare dalle liste operative (Clienti & Animali, ricerca per
  // nuovo appuntamento), ma tutto il suo storico (incassi, prenotazioni passate) resta intatto e
  // continua a comparire in Dashboard. Una vera SQL DELETE avrebbe reso "orfani" gli appuntamenti
  // passati, facendoli sparire anche dalle statistiche — l'opposto di quello che vuoi.
  const handleEliminaCliente = async (clienteId) => {
    const { error } = await sb.from("clienti").update({ attivo: false }).eq("id", clienteId);
    if (error) { console.error(error); return; }
    setClienti((prev) => prev.map((c) => c.id === clienteId ? { ...c, attivo: false } : c));
  };

  const handleAggiungiTariffaDefault = async (regola) => {
    const { data, error } = await sb.from("tariffe_default").insert(tariffaDefaultToDb(regola)).select().single();
    if (error) { console.error(error); alert("Errore nel salvataggio della tariffa di default."); return; }
    setTariffeDefault((prev) => [...prev, tariffaDefaultFromDb(data)]);
  };

  const handleRimuoviTariffaDefault = async (id) => {
    const { error } = await sb.from("tariffe_default").delete().eq("id", id);
    if (error) { console.error(error); return; }
    setTariffeDefault((prev) => prev.filter((t) => t.id !== id));
  };


  const handleNuovoCliente = async ({ nomeCliente, nomeAnimale, specieAnimale, telefono, incompatSpecifiche }) => {

    const { data: rigaCliente, error: errCliente } = await sb.from("clienti").insert({
      nome: nomeCliente, telefono, indirizzo: "", data_inizio: OGGI_ISO, storico_servizi: 0, storico_incasso_totale: 0, attivo: true,
    }).select().single();
    if (errCliente) { console.error(errCliente); return null; }
    const nuovoCliente = clienteFromDb(rigaCliente);
    setClienti((prev) => [...prev, nuovoCliente]);

    const { data: rigaAnimale, error: errAnimale } = await sb.from("animali").insert({
      cliente_id: nuovoCliente.id, nome: nomeAnimale, razza: "", eta: "", taglia: "",
      specie: specieAnimale || "cane", sesso: "M", foto: null, temperamento: [], allergie: "nessuna nota",
      farmaci: [], note: "", incompatibile: incompatSpecifiche || [],
    }).select().single();
    if (errAnimale) { console.error(errAnimale); return null; }
    const nuovoAnimale = animaleFromDb(rigaAnimale);
    setAnimali((prev) => [...prev, nuovoAnimale]);

    return { clienteId: nuovoCliente.id, animaleId: nuovoAnimale.id };
  };



  const handleSalvaClienteAnimale = async (datiCliente, datiAnimale, animaleId, clienteId) => {
    if (animaleId && clienteId) {
      const { error: e1 } = await sb.from("clienti").update({ nome: datiCliente.nome, telefono: datiCliente.telefono, indirizzo: datiCliente.indirizzo }).eq("id", clienteId);
      const { error: e2 } = await sb.from("animali").update(animaleToDb({ ...datiAnimale, clienteId })).eq("id", animaleId);
      if (e1 || e2) { console.error(e1 || e2); return { clienteId, animaleId }; }
      setClienti((prev) => prev.map((c) => c.id === clienteId ? { ...c, ...datiCliente } : c));
      setAnimali((prev) => prev.map((a) => a.id === animaleId ? { ...a, ...datiAnimale } : a));
      return { clienteId, animaleId };
    }

    const { data: rigaCliente, error: errC } = await sb.from("clienti").insert({
      nome: datiCliente.nome, telefono: datiCliente.telefono, indirizzo: datiCliente.indirizzo,
      data_inizio: OGGI_ISO, storico_servizi: 0, storico_incasso_totale: 0, attivo: true,
    }).select().single();
    if (errC) { console.error(errC); return null; }
    const nuovoCliente = clienteFromDb(rigaCliente);

    const { data: rigaAnimale, error: errA } = await sb.from("animali").insert(animaleToDb({ ...datiAnimale, clienteId: nuovoCliente.id })).select().single();
    if (errA) { console.error(errA); return null; }
    const nuovoAnimale = animaleFromDb(rigaAnimale);

    setClienti((prev) => [...prev, nuovoCliente]);
    setAnimali((prev) => [...prev, nuovoAnimale]);
    return { clienteId: nuovoCliente.id, animaleId: nuovoAnimale.id };
  };


  if (caricamento) {
    return (
      <div className="ff-sans min-h-screen flex items-center justify-center" style={{ backgroundColor: paper }}>
        <p className="ff-sans text-sm" style={{ color: faint }}>Caricamento dati…</p>
      </div>
    );
  }
  if (erroreCaricamento) {
    return (
      <div className="ff-sans min-h-screen flex items-center justify-center p-6 text-center" style={{ backgroundColor: paper }}>
        <p className="ff-sans text-sm" style={{ color: coral }}>{erroreCaricamento}</p>
      </div>
    );
  }

  const views = {
    oggi: <VistaOggi appuntamenti={appuntamenti} animali={animali} clienti={clienti} onApriModifica={(a) => setModale({ esistente: a })} />,

    agenda: (
      <VistaAgenda
        appuntamenti={appuntamenti} animali={animali} clienti={clienti}
        onApriModifica={(a) => setModale({ esistente: a })}
        onApriNuovo={(data) => setModale({ dataDefault: data })}
        meseVista={agendaMese} annoVista={agendaAnno} weekEsplosa={agendaWeek}
        onSelezionaSettimana={agendaSelezionaSettimana}
        onSelezionaMese={agendaSelezionaMese}
      />
    ),
    clienti: <VistaClienti appuntamenti={appuntamenti} animali={animali} clienti={clienti} onSalvaClienteAnimale={handleSalvaClienteAnimale} onEliminaCliente={handleEliminaCliente} />,
    dashboard: <VistaDashboard appuntamenti={appuntamenti} clienti={clienti} animali={animali} onApriModifica={(a) => setModale({ esistente: a })}
      tariffeDefault={tariffeDefault} onAggiungiTariffaDefault={handleAggiungiTariffaDefault} onRimuoviTariffaDefault={handleRimuoviTariffaDefault} />,
  };
  return (
    <div className="ff-sans min-h-screen" style={{ backgroundColor: paper }}>
      <FontImport />

      {/* Contenuto a piena larghezza: la sidebar laterale non esiste più.
          pb-24 garantisce che nulla resti coperto dalla tab bar fissa in basso. */}
      <div className="min-w-0 p-3 sm:p-6 md:p-10 pb-24">{views[view]}</div>

      {/* Tab bar fissa in basso, stile Instagram: solo icone, equidistanziate, sempre visibile. */}
      <div className="fixed bottom-0 left-0 right-0 z-30 flex items-center justify-around glass" style={{ backgroundColor: glassPaper, boxShadow: "0 -8px 32px rgba(35,40,31,0.08)", height: 64 }}>
  {nav.map((n) => <NavItem key={n.key} icon={n.icon} label={n.label} active={view === n.key} onClick={() => setView(n.key)} />)}
</div>

      {modale && (
        <ModaleAppuntamento esistente={modale.esistente} dataDefault={modale.dataDefault} clienti={clienti} animali={animali} appuntamenti={appuntamenti}
          onClose={() => setModale(null)} onSalva={handleSalva} onAnnullaApp={handleAnnulla} onNuovoCliente={handleNuovoCliente} tariffeDefault={tariffeDefault} />
      )}

    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
