  /* Disabilita l'effetto "elastico" di Safari/iOS quando si scorre oltre i limiti della pagina
     (mostrava uno spazio bianco vuoto in alto/basso durante lo scroll eccessivo). html è fissato
     all'altezza dello schermo e non scrollabile; il vero scroll avviene dentro #root. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  #root { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
/* Fix sovrapposizione con la status bar di iPhone (orologio/batteria/segnale) quando l'app
è aperta a schermo intero da Home. env(safe-area-inset-top) viene calcolato automaticamente
da iOS in base al modello (notch, Dynamic Island, o nessuno) — nessun valore fisso necessario.
Richiede "viewport-fit=cover" nel meta viewport (già presente) per avere effetto reale. /
body { padding-top: env(safe-area-inset-top); }
.ff-serif { font-family: 'Fraunces', serif; }
.ff-sans { font-family: 'IBM Plex Sans', sans-serif; }
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-thumb { background: #D6D0BE; border-radius: 10px; }
select { appearance: none; -webkit-appearance: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; }
/* iOS Safari ingrandisce automaticamente la pagina quando il campo attivo ha font-size
inferiore a 16px: forzandolo qui su tutti i campi, lo zoom non scatta più — resta
solo l'apparizione della tastiera, come richiesto. /
input, select, textarea { font-size: 16px !important; }

const pad = (n) => n.toString().padStart(2, "0");
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
const fmtGiornoLabelFull = (d) => `${GIORNI_FULL[(d.getDay() + 6) % 7]} ${d.getDate()}`;
const fmtBreve = (iso) => { const d = fromISO(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const giorniTra = (ritiroIso, riconsegnaIso) => {
  const diff = Math.round((fromISO(riconsegnaIso) - fromISO(ritiroIso)) / 86400000);
  return Math.max(1, diff + 1);
};

const timeToMinutes = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const minutesToTime = (mins) => { let m = ((mins % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const addMinutesToTime = (t, delta) => minutesToTime(timeToMinutes(t) + delta);
const diffMinutiTime = (t1, t2) => { let d = timeToMinutes(t2) - timeToMinutes(t1); if (d < 0) d += 1440; return d; };
const nearestFiveMinutes = (date) => {
  const h = date.getHours();
  const m = Math.round(date.getMinutes() / 5) * 5;
  if (m === 60) return `${pad((h + 1) % 24)}:00`;
  return `${pad(h)}:${pad(m)}`;
};

// ---------- Lookup ----------

const clienteById = (clienti, id) => clienti.find((c) => c.id === id);

// Sesso espresso per intero ("Maschio"/"Femmina"), mai la sigla M/F.
function etichettaSesso(sesso) {
  return sesso === "F" ? "Femmina" : "Maschio";
}

// Il campo Età contiene solo il numero inserito — qui si aggiunge "anni" in esposizione.
function formatEta(eta) {
  if (!eta) return "";
  const soloNumero = /^\d+$/.test(String(eta).trim());
  return soloNumero ? `${eta} anni` : eta;
}

// ---------- Tariffe di default (prezzi suggeriti per servizio / specie / animale) ----------
// Priorità di ricerca, dalla più specifica alla più generica:
// 1) regola legata a un animale preciso, 2) regola legata alla specie (cane/gatto),
// 3) regola generica per quel tipo di servizio, 4) valore fisso di fallback dell'app.
const FALLBACK_TARIFFE = { "Passeggiata": 15, "Visita domiciliare": 15, "Pensione": 35 };
function trovaPrezzoDefault(tariffeDefault, tipo, animale) {
  if (animale) {
    const perAnimale = tariffeDefault.find((t) => t.tipo === tipo && t.animaleId === animale.id);
    if (perAnimale) return perAnimale.prezzo;
    if (animale.specie) {
      const perSpecie = tariffeDefault.find((t) => t.tipo === tipo && !t.animaleId && t.specie === animale.specie);
      if (perSpecie) return perSpecie.prezzo;
    }
  }
  const generico = tariffeDefault.find((t) => t.tipo === tipo && !t.animaleId && !t.specie);
  if (generico) return generico.prezzo;
  return FALLBACK_TARIFFE[tipo] ?? 15;
}

// ---------- Ranking cliente ----------
function calcolaRanking(cliente, appuntamenti) {
  const relativi = appuntamenti.filter((a) => a.clienteId === cliente.id);
  const nonAnnullati = relativi.filter((a) => a.stato !== "annullato");
  const annullati = relativi.filter((a) => a.stato === "annullato");

  const mesiCliente = Math.max(1, (OGGI - fromISO(cliente.dataInizio)) / (1000 * 60 * 60 * 24 * 30));

  const incassoTotale = cliente.storicoIncassoTotale + nonAnnullati.reduce((s, a) => s + a.tariffaTotale, 0);
  const serviziTotali = cliente.storicoServizi + nonAnnullati.length;

  const incassoMensileMedio = incassoTotale / mesiCliente;
  const serviziMensileMedio = serviziTotali / mesiCliente;

  const valoreScore = Math.min(35, (incassoMensileMedio / 300) * 35);
  const frequenzaScore = Math.min(25, (serviziMensileMedio / 12) * 25);

  const totaliCreati = relativi.length;
  const tassoAnnullamento = totaliCreati ? annullati.length / totaliCreati : 0;
  const costanzaScore = 25 * (1 - tassoAnnullamento);

  const anzianitaScore = Math.min(10, mesiCliente / 3);
  let recenzaScore = 0;
  if (nonAnnullati.length > 0) {
    const ultimaData = nonAnnullati.reduce((max, a) => (a.dataRitiro > max ? a.dataRitiro : max), nonAnnullati[0].dataRitiro);
    const giorniDaUltimo = Math.round((OGGI - fromISO(ultimaData)) / 86400000);
    if (giorniDaUltimo <= 30) recenzaScore = 5;
    else if (giorniDaUltimo <= 90) recenzaScore = 2;
  }
  const fedeltaScore = anzianitaScore + recenzaScore;

  const punteggio = Math.round(valoreScore + frequenzaScore + costanzaScore + fedeltaScore);
  // Questo è il punteggio "grezzo" assoluto (0-100, su benchmark fissi) — usato SOLO come base
  // di calcolo per il ranking relativo definito sotto. Non viene mostrato direttamente all'utente.
  return { punteggio: Math.max(0, Math.min(100, punteggio)), meseComeCliente: mesiCliente };
}

// Richiesta: ranking RELATIVO fra tutti i clienti attuali. Prende il punteggio grezzo più alto e
// quello più basso fra TUTTI i clienti (ricalcolati ogni volta che appuntamenti cambia, quindi anche
// a ogni nuova prenotazione) e riscala linearmente: il migliore ottiene sempre 100, il peggiore
// sempre 0, gli altri si posizionano in proporzione fra i due estremi.
function calcolaRankingRelativo(clienti, appuntamenti) {
  const grezzi = clienti.map((c) => ({ id: c.id, assoluto: calcolaRanking(c, appuntamenti).punteggio }));
  const valori = grezzi.map((g) => g.assoluto);
  const max = Math.max(...valori);
  const min = Math.min(...valori);
  const range = max - min;
  const mappa = {};
  grezzi.forEach(({ id, assoluto }) => {
    const relativo = range === 0 ? 100 : Math.round(((assoluto - min) / range) * 100);
    let etichetta = "Cliente occasionale", tono = "coral";
    if (relativo >= 80) { etichetta = "Cliente top"; tono = "sage"; }
    else if (relativo >= 60) { etichetta = "Cliente affidabile"; tono = "sage"; }
    else if (relativo >= 40) { etichetta = "Cliente regolare"; tono = "gold"; }
    mappa[id] = { punteggio: relativo, etichetta, tono };
  });
  return mappa;
}
// ---------- Statistiche periodo (per Dashboard) ----------
// Richiesta 8: gli appuntamenti annullati restano nel DB e continuano ad alimentare
// statistiche e analisi — qui NON vengono esclusi di default dove serve l'analisi storica,
// ma per coerenza con l'originale, i costi/incassi derivano solo da stato !== annullato
// (comportamento preesistente, mantenuto). Il filtro "esclusi dall'agenda" è separato.
function calcolaStatistichePeriodo(appuntamenti, periodo, filtroMese, filtroAnno) {
  const start = periodo === "mese" ? new Date(filtroAnno, filtroMese, 1) : new Date(filtroAnno, 0, 1);
  const end = periodo === "mese" ? new Date(filtroAnno, filtroMese + 1, 0) : new Date(filtroAnno, 11, 31);
  const filtrati = appuntamenti.filter((a) => a.stato !== "annullato" && fromISO(a.dataRitiro) >= start && fromISO(a.dataRitiro) <= end);
  let oreTotali = 0;
  const clientiSet = new Set();
  const animaliSet = new Set();
  filtrati.forEach((a) => {
    const dtRitiro = combinaDataOra(a.dataRitiro, a.oraRitiro);
    const dtRiconsegna = combinaDataOra(a.dataRiconsegna, a.oraRiconsegna);
    oreTotali += Math.max(0, (dtRiconsegna - dtRitiro) / 3600000);
    clientiSet.add(a.clienteId);
    animaliSet.add(a.animaleId);
  });
  return { oreLavorate: Math.round(oreTotali * 10) / 10, clientiAttivi: clientiSet.size, animaliAttivi: animaliSet.size };
}

const pensioniAttiveIn = (iso, appuntamenti) =>
  appuntamenti.filter((a) => a.tipo === "Pensione" && a.stato !== "annullato" && a.dataRitiro <= iso && a.dataRiconsegna >= iso);

// ---------- Motore conflitti ----------

// LOGISTICA: la "finestra di occupazione" del sitter per un appuntamento.
// - Passeggiata / Visita domiciliare: intervallo [inizio, fine) — l'intera durata del servizio.
// - Pensione: SOLO due istanti puntuali (ritiro e riconsegna). Il soggiorno in sé
//   NON occupa il sitter per tutta la sua durata — può gestire altri animali nel frattempo.
function finestreLogistica(app) {
  const ritiroDT = combinaDataOra(app.dataRitiro, app.oraRitiro);
  const riconsegnaDT = combinaDataOra(app.dataRiconsegna, app.oraRiconsegna);
  if (app.tipo === "Pensione") {
    return [{ tipo: "punto", t: ritiroDT }, { tipo: "punto", t: riconsegnaDT }];
  }
  return [{ tipo: "range", s: ritiroDT, e: riconsegnaDT }];
}

// Due intervalli continui si sovrappongono con la regola classica dei semi-intervalli:
// appuntamenti "back-to-back" (uno finisce esattamente quando l'altro inizia) NON sono in conflitto.
const rangeSiSovrappongono = (s1, e1, s2, e2) => s1 < e2 && s2 < e1;

// Un istante puntuale (ritiro/riconsegna pensione) è "dentro" un range se cade da inizio
// INCLUSO a fine escluso: prenotare un servizio ESATTAMENTE all'ora di ritiro/riconsegna
// dà conflitto, ma un servizio che parte anche un solo minuto dopo no.
const puntoDentroRange = (t, s, e) => t >= s && t < e;

function finestreSiSovrappongono(f1, f2) {
  if (f1.tipo === "range" && f2.tipo === "range") return rangeSiSovrappongono(f1.s, f1.e, f2.s, f2.e);
  if (f1.tipo === "punto" && f2.tipo === "range") return puntoDentroRange(f1.t, f2.s, f2.e);
  if (f1.tipo === "range" && f2.tipo === "punto") return puntoDentroRange(f2.t, f1.s, f1.e);
  // punto vs punto: conflitto solo se esattamente lo stesso istante.
  return f1.t.getTime() === f2.t.getTime();
}

// COMPATIBILITÀ: l'intero intervallo del soggiorno (solo per Pensione) — da ritiro a riconsegna.
// Usato SOLO per il confronto Pensione-vs-Pensione (vedi rilevaConflitti).
function soggiornoCompleto(app) {
  return [combinaDataOra(app.dataRitiro, app.oraRitiro), combinaDataOra(app.dataRiconsegna, app.oraRiconsegna)];
}
// ---------- Regole di incompatibilità a più livelli ----------
// Una regola può essere: numero (legacy, ID animale), { tipo: "animale", animaleId },
// oppure { tipo: "filtro", specie, sesso, taglie } — generica a qualsiasi livello di dettaglio.
function regolaCoinvolgeAnimale(regola, animale) {
  if (!animale) return false;
  if (typeof regola === "number") return animale.id === regola;
  if (regola.tipo === "animale") return animale.id === regola.animaleId;
  if (regola.tipo === "filtro") {
    if (animale.specie !== regola.specie) return false;
    if (regola.sesso && regola.sesso !== "tutti" && animale.sesso !== regola.sesso) return false;
    if (regola.taglie && regola.taglie.length > 0 && !regola.taglie.includes(animale.taglia)) return false;
    return true;
  }
  return false;
}

function chiaveRegola(regola) {
  if (typeof regola === "number") return `animale:${regola}`;
  if (regola.tipo === "animale") return `animale:${regola.animaleId}`;
  if (regola.tipo === "filtro") return `filtro:${regola.specie}:${regola.sesso || "tutti"}:${(regola.taglie || []).slice().sort().join(",")}`;
  return JSON.stringify(regola);
}

function etichettaRegola(regola, animali) {
  if (typeof regola === "number") {
    const al = animaleById(animali, regola);
    return al ? al.nome : "Animale rimosso";
  }
  if (regola.tipo === "animale") {
    const al = animaleById(animali, regola.animaleId);
    return al ? al.nome : "Animale rimosso";
  }
  if (regola.tipo === "filtro") {
    const base = regola.specie === "cane" ? "Cani" : "Gatti";
    const sessoLabel = regola.sesso === "M" ? " maschi" : regola.sesso === "F" ? " femmine" : "";
    let taglieLabel = "";
    if (regola.taglie && regola.taglie.length > 0) {
      taglieLabel = ` di taglia ${regola.taglie.map((t) => t.toLowerCase()).join(" o ")}`;
    }
    return `${base}${sessoLabel}${taglieLabel}`;
  }
  return "—";
}

// Aggrega "Cani" + "Gatti" generici in un'unica etichetta "Cani e gatti" quando presenti entrambi.
function etichetteIncompatAggregate(regole, animali) {
  const isBase = (r, specieTarget) => r && typeof r !== "number" && r.tipo === "filtro" && r.specie === specieTarget
    && (!r.sesso || r.sesso === "tutti") && (!r.taglie || r.taglie.length === 0);
  const haiCaniBase = regole.some((r) => isBase(r, "cane"));
  const haiGattiBase = regole.some((r) => isBase(r, "gatto"));
  const etichette = [];
  if (haiCaniBase && haiGattiBase) etichette.push("Cani e gatti");
  regole.forEach((r) => {
    if (haiCaniBase && haiGattiBase && (isBase(r, "cane") || isBase(r, "gatto"))) return;
    etichette.push(etichettaRegola(r, animali));
  });
  return etichette;
}

function sonoIncompatibili(animA, animB) {
  if (!animA || !animB || animA.id === animB.id) return false;
  const regoleA = animA.incompatibile || [];
  const regoleB = animB.incompatibile || [];
  const aVietaB = regoleA.some((r) => regolaCoinvolgeAnimale(r, animB));
  const bVietaA = regoleB.some((r) => regolaCoinvolgeAnimale(r, animA));
  return aVietaB || bVietaA;
}
function rilevaConflitti(candidato, appuntamenti, animali) {
  const conflitti = [];
  const animaleNuovo = animaleById(animali, candidato.animaleId);
  if (!animaleNuovo) return conflitti;

  const finestreNuovo = finestreLogistica(candidato);
  const soggiornoNuovo = candidato.tipo === "Pensione" ? soggiornoCompleto(candidato) : null;

  appuntamenti.forEach((a) => {
    if (a.id === candidato.id) return;
    if (a.stato === "annullato") return;
    const animaleAltro = animaleById(animali, a.animaleId);
    if (!animaleAltro) return;

    // --- Incompatibilità: conta SOLO se ENTRAMBI gli appuntamenti sono Pensione
    // e i loro soggiorni (l'intera durata, non solo ritiro/riconsegna) si sovrappongono.
    // Se uno dei due è Passeggiata o Visita domiciliare, l'incompatibilità non si applica mai.
    if (candidato.tipo === "Pensione" && a.tipo === "Pensione") {
      const soggiornoAltro = soggiornoCompleto(a);
      const soggiorniSiSovrappongono = rangeSiSovrappongono(soggiornoNuovo[0], soggiornoNuovo[1], soggiornoAltro[0], soggiornoAltro[1]);
      if (soggiorniSiSovrappongono && sonoIncompatibili(animaleNuovo, animaleAltro)) {
        conflitti.push({ tipo: "compatibilita", messaggio: `${animaleNuovo.nome} potrebbe non essere compatibile con ${animaleAltro.nome}, già in soggiorno dal ${fmtBreve(a.dataRitiro)} al ${fmtBreve(a.dataRiconsegna)}.` });
      }
    }

    // --- Logistica: indipendente dalla compatibilità, basata SOLO sugli orari.
    // Passeggiata/Visita occupano l'intero intervallo; Pensione occupa solo gli istanti
    // di ritiro e riconsegna (il soggiorno stesso non blocca altri appuntamenti).
    const finestreAltro = finestreLogistica(a);
    const sovrappostiLogistica = finestreNuovo.some((f1) => finestreAltro.some((f2) => finestreSiSovrappongono(f1, f2)));
    if (sovrappostiLogistica) {
      conflitti.push({ tipo: "logistica", messaggio: `Hai già un impegno con ${animaleAltro.nome} (${a.tipo}) che si sovrappone in orario con questo appuntamento.` });
    }
  });

  return conflitti;
}
// ---------- Costruzione eventi del giorno (timeline operativa) ----------
function etichettaEventoInizio(tipo, nomeAnimale) {
  if (tipo === "Passeggiata") return `Inizio passeggiata con ${nomeAnimale}`;
  if (tipo === "Visita domiciliare") return `Visita ${nomeAnimale}`;
  return `Arriva ${nomeAnimale}`;
}
function etichettaEventoFine(tipo, nomeAnimale) {
  if (tipo === "Pensione") return `Riconsegna ${nomeAnimale}`;
  if (tipo === "Visita domiciliare") return `Fine della visita per ${nomeAnimale}`;
  return `Fine della passeggiata con ${nomeAnimale}`;
}
function costruisciEventiGiorno(appuntamenti, animali, isoGiorno) {
  const eventi = [];
  appuntamenti
    .filter((a) => a.stato !== "annullato" && (a.dataRitiro === isoGiorno || a.dataRiconsegna === isoGiorno))
    .forEach((a) => {
      const animale = animaleById(animali, a.animaleId);
      if (!animale) return;
      if (a.dataRitiro === isoGiorno) {
        eventi.push({ ora: a.oraRitiro, label: etichettaEventoInizio(a.tipo, animale.nome), appuntamento: a, animale, ruolo: "inizio" });
      }
      if (a.dataRiconsegna === isoGiorno) {
        eventi.push({ ora: a.oraRiconsegna, label: etichettaEventoFine(a.tipo, animale.nome), appuntamento: a, animale, ruolo: "fine" });
      }
    });
  eventi.sort((x, y) => x.ora.localeCompare(y.ora));
  return eventi;
}

// Normalizza un orario estratto "H:MM" o "HH:MM" nel formato sempre "HH:MM" a due cifre.
// Indispensabile perché il confronto cronologico (localeCompare) tra stringhe orario
// funziona correttamente SOLO se tutte sono zero-paddate: "9:15" risulta > "15:00"
// come stringa (bug di ordinamento), mentre "09:15" < "15:00" è corretto.
// Senza questa normalizzazione, un orario farmaco scritto come "9:15" invece di "09:15"
// finiva catapultato in fondo/posizione sbagliata nella timeline, sembrando "non inserito".
// Normalizza un orario "H:MM"/"HH:MM" in formato sempre a due cifre.
// Serve solo come fallback per eventuali dati storici inseriti come testo libero
// prima dell'introduzione del TimeSelect sul campo farmaco.
function normalizzaOraHHMM(str) {
  const [h, m] = str.split(":");
  return `${h.padStart(2, "0")}:${m}`;
}

// Estrae eventi-farmaco per gli animali in pensione/soggiorno nel giorno indicato.
// Caso standard (nuovo): f.orario è già "HH:MM", inserito con lo stesso TimeSelect
// degli appuntamenti → si inserisce automaticamente nel punto cronologico corretto
// della timeline, mescolato con gli altri blocchi (passeggiate/visite/pensioni).
// Fallback (dati storici pre-migrazione, testo libero): tenta l'estrazione con regex.
function costruisciEventiFarmaco(appuntamenti, animali, isoGiorno) {
  const eventi = [];
  const animaliInSoggiorno = new Set(pensioniAttiveIn(isoGiorno, appuntamenti).map((a) => a.animaleId));
  animali.forEach((animale) => {
    if (!animaliInSoggiorno.has(animale.id)) return;
    (animale.farmaci || []).forEach((f, idx) => {
      if (!f.nome || !f.orario) return;
      const orarioTrim = f.orario.trim();
      if (/^\d{1,2}:\d{2}$/.test(orarioTrim)) {
        eventi.push({ ora: normalizzaOraHHMM(orarioTrim), animale, farmaco: f, key: `farmaco-${animale.id}-${idx}` });
        return;
      }
      const orari = orarioTrim.match(/\d{1,2}:\d{2}/g);
      if (orari && orari.length > 0) {
        orari.forEach((oraRaw, i) => {
          eventi.push({ ora: normalizzaOraHHMM(oraRaw), animale, farmaco: f, key: `farmaco-${animale.id}-${idx}-${i}` });
        });
      } else {
        eventi.push({ ora: "00:00", oraTesto: orarioTrim, animale, farmaco: f, key: `farmaco-${animale.id}-${idx}` });
      }
    });
  });
  eventi.sort((x, y) => x.ora.localeCompare(y.ora));
  return eventi;
}

// ---------- Selettore orario 24h — SEMPRE editabile (richiesta 4) ----------
// Oltre ai due select (ore/minuti) rapidi, è disponibile un input manuale testuale.
function TimeSelect({ value, onChange }) {
  const [hh, mm] = (value || "00:00").split(":");
  const [modoManuale, setModoManuale] = useState(false);
  const [oreManuali, setOreManuali] = useState(hh);
  const [minutiManuali, setMinutiManuali] = useState(mm);

  useEffect(() => {
    const [h, m] = (value || "00:00").split(":");
    setOreManuali(h);
    setMinutiManuali(m);
  }, [value]);

  // Due campi separati (ore / minuti), SOLO numerici: su iPhone la tastiera numerica non ha i
  // due punti ":", quindi non è più necessario scrivere "9:00" in un unico campo — qui si digitano
  // semplicemente i due numeri separatamente.
  const commitOre = (v) => {
    const n = parseInt(v, 10);
    if (!isNaN(n) && n >= 0 && n <= 23) onChange(`${pad(n)}:${minutiManuali}`);
    else setOreManuali(hh);
  };
  const commitMinuti = (v) => {
    const n = parseInt(v, 10);
    if (!isNaN(n) && n >= 0 && n <= 59) onChange(`${oreManuali}:${pad(n)}`);
    else setMinutiManuali(mm);
  };

  if (modoManuale) {
    return (
      <div className="flex items-center gap-1.5">
        <input
          type="text"
          inputMode="numeric"
          placeholder="hh"
          maxLength={2}
          className={inputStyle + " text-center"}
          style={{ ...inputBg, flex: 1 }}
          value={oreManuali}
          onChange={(e) => setOreManuali(e.target.value.replace(/[^0-9]/g, ""))}
          onBlur={(e) => commitOre(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") commitOre(e.target.value); }}
        />
        <span className="ff-sans text-sm shrink-0" style={{ color: faint }}>:</span>
        <input
          type="text"
          inputMode="numeric"
          placeholder="mm"
          maxLength={2}
          className={inputStyle + " text-center"}
          style={{ ...inputBg, flex: 1 }}
          value={minutiManuali}
          onChange={(e) => setMinutiManuali(e.target.value.replace(/[^0-9]/g, ""))}
          onBlur={(e) => commitMinuti(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") commitMinuti(e.target.value); }}
        />
        <button type="button" onClick={() => setModoManuale(false)} className="ff-sans text-[11px] px-2 py-2 rounded-lg shrink-0" style={{ backgroundColor: paperDeep, color: muted }} title="Torna alla selezione rapida">
          <Clock size={13} />
        </button>
      </div>
    );
  }

  return (
    <div className="flex gap-1">
      <select className={inputStyle} style={{ ...inputBg, flex: 1 }} value={hh} onChange={(e) => onChange(`${e.target.value}:${mm}`)}>
        {ORE_24.map((h) => <option key={h} value={h}>{h}</option>)}
      </select>
      <select className={inputStyle} style={{ ...inputBg, flex: 1 }} value={mm} onChange={(e) => onChange(`${hh}:${e.target.value}`)}>
        {MINUTI_5.map((m) => <option key={m} value={m}>{m}</option>)}
      </select>
      <button type="button" onClick={() => setModoManuale(true)} className="ff-sans text-[11px] px-2 py-2 rounded-lg shrink-0" style={{ backgroundColor: paperDeep, color: muted }} title="Inserisci orario manualmente">
        <Pencil size={13} />
      </button>
    </div>
  );
}

// Selettore orario farmaco: due dropdown separati (ore / minuti), SENZA valore di default.
// A differenza di TimeSelect (usato per gli appuntamenti, sempre con un orario valido),
// qui il campo può restare vuoto finché l'utente non sceglie volontariamente ora e minuti.
function OrarioFarmacoSelect({ value, onChange }) {
  const [hh, mm] = (value || "").split(":");

  const handleOra = (nuovaOra) => {
    if (!nuovaOra) { onChange(""); return; }
    onChange(`${nuovaOra}:${mm || "00"}`);
  };
  const handleMin = (nuovoMin) => {
    if (!nuovoMin) { onChange(""); return; }
    onChange(`${hh || "00"}:${nuovoMin}`);
  };

  return (
    <div className="flex gap-1.5">
      <select className={inputStyle} style={{ ...inputBg, flex: 1 }} value={hh || ""} onChange={(e) => handleOra(e.target.value)}>
        <option value="">--</option>
        {ORE_24.map((h) => <option key={h} value={h}>{h}</option>)}
      </select>
      <select className={inputStyle} style={{ ...inputBg, flex: 1 }} value={mm || ""} onChange={(e) => handleMin(e.target.value)}>
        <option value="">--</option>
        {MINUTI_5.map((m) => <option key={m} value={m}>{m}</option>)}
      </select>
    </div>
  );
}
// ---------- Campo data SEMPRE editabile: calendario nativo + inserimento manuale (richiesta 4) ----------
function DateField({ value, onChange, min }) {
  const [modoManuale, setModoManuale] = useState(false);
  const [manualeVal, setManualeVal] = useState(value ? fmtBreve(value) : "");

  useEffect(() => { setManualeVal(value ? fmtBreve(value) : ""); }, [value]);

  const commitManuale = (v) => {
    const match = /^(\d{1,2})\/(\d{1,2})\/?(\d{2,4})?$/.exec(v.trim());
    if (match) {
      const giorno = Number(match[1]);
      const mese = Number(match[2]);
      let anno = match[3] ? Number(match[3]) : fromISO(value).getFullYear();
      if (anno < 100) anno += 2000;
      const d = new Date(anno, mese - 1, giorno);
      if (!isNaN(d.getTime())) { onChange(toISO(d)); return; }
    }
    setManualeVal(value ? fmtBreve(value) : "");
  };

  if (modoManuale) {
    return (
      <div className="flex items-center gap-1.5">
        <input
          type="text"
          inputMode="numeric"
          placeholder="gg/mm/aaaa"
          className={inputStyle}
          style={{ ...inputBg, flex: 1 }}
          value={manualeVal}
          onChange={(e) => setManualeVal(e.target.value)}
          onBlur={(e) => commitManuale(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") commitManuale(e.target.value); }}
        />
        <button type="button" onClick={() => setModoManuale(false)} className="ff-sans text-[11px] px-2 py-2 rounded-lg shrink-0" style={{ backgroundColor: paperDeep, color: muted }} title="Usa il calendario">
          <CalendarDays size={13} />
        </button>
      </div>
    );
  }

  return (
    <div className="flex items-center gap-1.5">
      <input type="date" className={inputStyle} style={{ ...inputBg, flex: 1 }} value={value} min={min} onChange={(e) => onChange(e.target.value)} />
      <button type="button" onClick={() => setModoManuale(true)} className="ff-sans text-[11px] px-2 py-2 rounded-lg shrink-0" style={{ backgroundColor: paperDeep, color: muted }} title="Inserisci data manualmente">
        <Pencil size={13} />
      </button>
    </div>
  );
}

// ---------- Builder cascata incompatibilità ----------
function IncompatibilitaBuilder({ animali, clienti, escludiId, selezionati, onSetFiltroPerSpecie, onAggiungiRegola, onRimuoviRegola }) {
  const [aperta, setAperta] = useState(false);
  const [query, setQuery] = useState("");

  const regolaFiltroPerSpecie = (specie) =>
    selezionati.find((r) => typeof r !== "number" && r.tipo === "filtro" && r.specie === specie) || null;

  const specieSelezionate = OPZIONI_SPECIE.map((o) => o.key).filter((key) => !!regolaFiltroPerSpecie(key));

  // Click su "Cani"/"Gatti": aggiunge o rimuove istantaneamente la regola di base per quella specie.
  const toggleSpecie = (key) => {
    const esistente = regolaFiltroPerSpecie(key);
    if (esistente) onSetFiltroPerSpecie(key, null);
    else onSetFiltroPerSpecie(key, { tipo: "filtro", specie: key, sesso: "tutti", taglie: [] });
  };

  // Click su sesso: aggiorna SUBITO la regola esistente per quella specie (nessuna conferma).
  const setSesso = (specie, val) => {
    const esistente = regolaFiltroPerSpecie(specie) || { tipo: "filtro", specie, sesso: "tutti", taglie: [] };
    onSetFiltroPerSpecie(specie, { ...esistente, sesso: val });
  };

  // Click su taglia: aggiorna SUBITO la regola esistente, aggiungendo/togliendo quella taglia.
  const toggleTaglia = (specie, val) => {
    const esistente = regolaFiltroPerSpecie(specie) || { tipo: "filtro", specie, sesso: "tutti", taglie: [] };
    const attuali = esistente.taglie || [];
    const nuove = attuali.includes(val) ? attuali.filter((x) => x !== val) : [...attuali, val];
    onSetFiltroPerSpecie(specie, { ...esistente, taglie: nuove });
  };

  const candidati = useMemo(() => {
    return animali.filter((a) => {
      if (escludiId && a.id === escludiId) return false;
      if (!specieSelezionate.includes(a.specie)) return false;
      const regola = regolaFiltroPerSpecie(a.specie);
      if (regola) {
        if (regola.sesso && regola.sesso !== "tutti" && a.sesso !== regola.sesso) return false;
        if (regola.taglie && regola.taglie.length > 0 && !regola.taglie.includes(a.taglia)) return false;
      }
      if (query) {
        const c = clienteById(clienti, a.clienteId);
        const q = query.toLowerCase();
        if (!a.nome.toLowerCase().includes(q) && !(c && c.nome.toLowerCase().includes(q))) return false;
      }
      return true;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [animali, clienti, escludiId, selezionati, query]);

  const selezionatiSetChiavi = useMemo(() => new Set(selezionati.map(chiaveRegola)), [selezionati]);
  const toggleAnimaleSpecifico = (animaleId) => {
    const regola = { tipo: "animale", animaleId };
    const chiave = chiaveRegola(regola);
    if (selezionatiSetChiavi.has(chiave)) {
      const idx = selezionati.findIndex((r) => chiaveRegola(r) === chiave);
      if (idx > -1) onRimuoviRegola(idx);
    } else {
      onAggiungiRegola(regola);
    }
  };

  return (
    <div>
      <div className="flex gap-1.5 mb-2 flex-wrap">
        {OPZIONI_SPECIE.map((opt) => (
          <TagToggle key={opt.key} label={opt.label} tono="coral" attivo={specieSelezionate.includes(opt.key)} onClick={() => toggleSpecie(opt.key)} />
        ))}
      </div>

      {specieSelezionate.map((sk) => {
        const regolaCorrente = regolaFiltroPerSpecie(sk);
        // Per "gatto" non esiste più la selezione del sesso: la regola resta sempre impostata
        // su sesso "tutti" (valore di default assegnato da toggleSpecie alla creazione), senza
        // alcun controllo per modificarlo. Per "cane" il comportamento resta invariato.
        if (sk === "gatto") return null;
        return (
          <div key={sk} className="pl-2 mb-2" style={{ borderLeft: `2px solid ${coral}` }}>
            <div className="flex items-center gap-1.5 flex-wrap">
              <span className="ff-sans text-[11px] shrink-0" style={{ color: faint }}>Cani:</span>
              {OPZIONI_SESSO.map((opt) => (
                <TagToggle key={opt.key} label={opt.label} tono="coral" attivo={regolaCorrente?.sesso === opt.key} onClick={() => setSesso(sk, opt.key)} />
              ))}
            </div>
            <div className="flex items-center gap-1.5 flex-wrap mt-1.5">
              <span className="ff-sans text-[11px] shrink-0" style={{ color: faint }}>Taglia:</span>
              {OPZIONI_TAGLIA.map((opt) => (
                <TagToggle key={opt.key} label={opt.label} tono="coral" attivo={(regolaCorrente?.taglie || []).includes(opt.key)} onClick={() => toggleTaglia(sk, opt.key)} />
              ))}
            </div>
          </div>
        );
      })}

      {specieSelezionate.length > 0 && (
        <button type="button" onClick={() => setAperta(!aperta)} className="flex items-center gap-1 ff-sans text-xs mb-2" style={{ color: coral }}>
          <ChevronDown size={12} style={{ transform: aperta ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
          Scegli animali specifici ({candidati.length} corrispondenti)
        </button>
      )}
      {aperta && (
        <div className="rounded-lg p-2 mb-2" style={{ backgroundColor: "#F2EFE6" }}>
          <div className="relative mb-2">
            <Search size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2" color={faint} />
            <input className={inputStyle + " pl-7 text-xs"} style={inputBg} value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Cerca per nome animale o proprietario…" />
          </div>
          <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto">
            {candidati.length === 0 && <p className="ff-sans text-xs" style={{ color: faint }}>Nessun animale trovato</p>}
            {candidati.map((al) => (
              <TagToggle key={al.id} label={al.nome} tono="coral" attivo={selezionatiSetChiavi.has(chiaveRegola({ tipo: "animale", animaleId: al.id }))} onClick={() => toggleAnimaleSpecifico(al.id)} />
            ))}
          </div>
        </div>
      )}

      {selezionati.length > 0 && (
        <div className="flex flex-wrap gap-1.5">
          {selezionati.map((regola, i) => (
            <span key={i} className="ff-sans text-[11px] px-2 py-1 rounded-full inline-flex items-center gap-1" style={{ backgroundColor: "rgba(255,255,255,0.45)", color: coral }}>
              {etichettaRegola(regola, animali)}
              <button type="button" onClick={() => onRimuoviRegola(i)}><X size={10} color={coral} /></button>
            </span>
          ))}
        </div>
      )}
    </div>
  );
}
// ---------- Durata editabile: incremento/decremento + digitazione diretta (richiesta 12) ----------
function DurataEditor({ minuti, onChange, step = 5, min = 10 }) {
  const [editValue, setEditValue] = useState(String(minuti));
  useEffect(() => { setEditValue(String(minuti)); }, [minuti]);

  const commit = (v) => {
    const n = parseInt(v, 10);
    if (!isNaN(n)) onChange(Math.max(min, n));
    else setEditValue(String(minuti));
  };

  return (
    <div className="flex items-center rounded-lg overflow-hidden" style={{ ...inputBg, height: 38, width: 190 }}>
      <button type="button" onClick={() => onChange(Math.max(min, minuti - step))} className="w-9 h-full flex items-center justify-center shrink-0 ff-sans text-base" style={{ backgroundColor: paperDeep, color: ink }}>−</button>
      <input
        type="text"
        inputMode="numeric"
        className="ff-sans text-sm text-center outline-none bg-transparent"
        style={{ color: ink, width: 48, minWidth: 0 }}
        value={editValue}
        onChange={(e) => setEditValue(e.target.value.replace(/[^0-9]/g, ""))}
        onBlur={(e) => commit(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") commit(e.target.value); }}
      />
      <span className="ff-sans text-xs shrink-0" style={{ color: faint }}>min</span>
      <button type="button" onClick={() => onChange(minuti + step)} className="w-9 h-full flex items-center justify-center shrink-0 ff-sans text-base ml-auto" style={{ backgroundColor: paperDeep, color: ink }}>+</button>
    </div>
  );
}
// ---------- Selettore giorni soggiorno: compatto, digitabile (richiesta 3 + 12 style) ----------

// ---------- Vista: Oggi (timeline dinamica) ----------
function RigaAppuntamento({ a, animale, indirizzo, mostraRitiro, mostraRiconsegna, oraCorrente, onClick, index = 0 }) {

      </div>
    </div>
  );
}
// ---------- Gantt giornaliero (occupazione animali) ----------
// Regole pensione: giorno di transito (preso prima, riconsegnato dopo oggi) → barra piena 00:00–24:00.
// Riconsegnato oggi (preso prima) → barra da 00:00 a ora riconsegna.
// Ritirato oggi (riconsegnato dopo oggi) → barra da ora ritiro a 24:00.
// Ritiro e riconsegna lo stesso giorno → barra normale ora ritiro–ora riconsegna.

function GanttGiorno({ appuntamenti, animali, iso }) {
  const righe = useMemo(() => {
    const perAnimale = {};
    appuntamenti.filter((a) => a.stato !== "annullato").forEach((a) => {
      let startMin = null, endMin = null, hasStartLabel = false, labelMin = null;
      if (a.tipo === "Pensione") {
        const arrivaOggi = a.dataRitiro === iso;
        const partOggi = a.dataRiconsegna === iso;
        if (arrivaOggi && partOggi) {
          // Ritiro e riconsegna lo stesso giorno: inizio reale oggi.
          startMin = timeToMinutes(a.oraRitiro); endMin = timeToMinutes(a.oraRiconsegna);
          hasStartLabel = true; labelMin = startMin;
        } else if (arrivaOggi && !partOggi) {
          // Arriva oggi, resta anche nei giorni successivi: inizio reale oggi.
          startMin = timeToMinutes(a.oraRitiro); endMin = 1440;
          hasStartLabel = true; labelMin = startMin;
        } else if (!arrivaOggi && partOggi) {
          // Preso prima, riconsegnato oggi: nessun "inizio" reale avviene oggi (barra da 00:00).
          startMin = 0; endMin = timeToMinutes(a.oraRiconsegna);
          hasStartLabel = false;
        } else if (a.dataRitiro < iso && a.dataRiconsegna > iso) {
          // Giorno di puro transito: barra piena, nessun "inizio" reale oggi.
          startMin = 0; endMin = 1440;
          hasStartLabel = false;
        } else return;
 } else {
        if (a.dataRitiro !== iso) return;
        startMin = timeToMinutes(a.oraRitiro);
        endMin = timeToMinutes(a.oraRiconsegna);
        // Servizio che attraversa la mezzanotte (es. inizio 23:50, fine 00:30 del giorno dopo):
        // l'orario di fine, letto come minuti dello stesso giorno, risulta "prima" dell'inizio.
        // Anziché forzare un incremento fittizio di 15 minuti (bug precedente — mostrava sempre
        // un orario vicino alla mezzanotte, mai quello reale), aggiungiamo un giorno intero (1440
        // minuti): così la durata e l'orario di fine mostrati restano sempre corretti, qualunque sia.
        if (endMin <= startMin) endMin += 1440;
        hasStartLabel = true; labelMin = startMin;
      }

      const animale = animaleById(animali, a.animaleId);
      if (!animale) return;
      if (!perAnimale[animale.id]) perAnimale[animale.id] = { animale, segmenti: [] };
      perAnimale[animale.id].segmenti.push({ startMin, endMin, tipo: a.tipo, id: a.id, hasStartLabel, labelMin });
    });
    return Object.values(perAnimale).sort((x, y) => x.animale.nome.localeCompare(y.animale.nome));
  }, [appuntamenti, animali, iso]);

  if (righe.length === 0) {
    return (
      <div className="rounded-2xl p-4 sm:p-5" style={{ backgroundColor: card }}>
        <p className="ff-sans text-sm font-medium mb-1" style={{ color: ink }}>Occupazione della giornata</p>
        <p className="ff-sans text-sm" style={{ color: faint }}>Nessun animale impegnato oggi.</p>
      </div>
    );
  }

  // Asse orario fisso ogni 4 ore: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00.
  const oreEtichette = [0, 4, 8, 12, 16, 20];

  return (
    <div className="rounded-2xl p-4 sm:p-5 mt-6" style={{ backgroundColor: card }}>
      <p className="ff-sans text-sm font-medium mb-3" style={{ color: ink }}>Occupazione della giornata</p>

      <div className="flex items-center gap-2 h-4 mb-1">
        <div className="w-16 sm:w-28 shrink-0" />
        <div className="relative flex-1 h-4">
          {oreEtichette.map((h) => {
            const min = h * 60;
            const pct = (min / 1440) * 100;
            // Ultima etichetta (24:00): ancorata al bordo destro per non uscire dal box.
            const isLast = h === 24;
            return (
              <span key={h} className="absolute ff-sans text-[9px] whitespace-nowrap" style={isLast ? { right: 0, color: faint } : { left: `${pct}%`, color: faint }}>
                {pad(h === 24 ? 24 : h)}:00
              </span>
            );
          })}
        </div>
      </div>

      <div className="flex flex-col gap-2">
        {righe.map(({ animale, segmenti }) => (
          <div key={animale.id} className="flex items-center gap-2">
            <div className="w-16 sm:w-28 shrink-0 ff-sans text-xs truncate" style={{ color: ink }}>{animale.nome}</div>
            <div className="relative flex-1 h-7 rounded-md" style={{ backgroundColor: "#F2EFE6" }}>
{segmenti.map((s, i) => {
                const col = coloriServizio(s.tipo);
                const left = (s.startMin / 1440) * 100;
                // La barra visiva non può superare il bordo destro del grafico (fine giornata),
                // anche se il servizio prosegue nel giorno dopo: qui limitiamo SOLO la larghezza.
                const endMinVisual = Math.min(s.endMin, 1440);
                const width = Math.max(((endMinVisual - s.startMin) / 1440) * 100, 1.2);
                const oraInizio = minutesToTime(s.startMin);
                // Orario di fine REALE per il tooltip: minutesToTime applica già il modulo 1440,
                // quindi anche se s.endMin supera 1440 (es. 1470) restituisce comunque l'orario
                // corretto del giorno dopo (1470 → "00:30"), mai troncato o sbagliato.
                const oraFine = minutesToTime(s.endMin);
                const attraversaMezzanotte = s.endMin > 1440;
                // Richiesta 5: niente orari fittizi (00:00/24:00) per i giorni di transito o parziali.
                let testoTooltip;
                if (s.hasStartLabel && s.endMin === 1440) {
                  testoTooltip = `${s.tipo} · dalle ${oraInizio}`;
                } else if (!s.hasStartLabel && s.startMin === 0 && s.endMin !== 1440) {
                  testoTooltip = `${s.tipo} · fino alle ${oraFine}`;
                } else if (!s.hasStartLabel && s.startMin === 0 && s.endMin === 1440) {
                  testoTooltip = `${s.tipo} — presente tutto il giorno`;
                } else if (attraversaMezzanotte) {
                  testoTooltip = `${s.tipo} · dalle ${oraInizio} alle ${oraFine} (giorno dopo)`;
                } else {
                  testoTooltip = `${s.tipo} · dalle ${oraInizio} alle ${oraFine}`;
                }
// Ancoraggio dinamico del tooltip: resta SEMPRE su una riga unica (come in origine),
                // ma se il segmento è vicino al bordo destro il tooltip si ancora a destra (si estende
                // verso sinistra) invece di restare centrato e sforare — niente wrapping del testo,
                // solo uno spostamento orizzontale per rientrare nel bordo del foglio.
                const ancoraggio = left > 60 ? "right-0" : left < 25 ? "left-0" : "left-1/2 -translate-x-1/2";
                return (
                  <div key={i} className="group absolute top-0.5 bottom-0.5 rounded-md cursor-default"
                    style={{ left: `${left}%`, width: `${width}%`, backgroundColor: col.bg, border: `1px solid ${col.fg}` }}>
                    {/* Tooltip CSS: compare istantaneamente su hover/tap, su una sola riga. */}
                    <div className={`absolute bottom-full mb-1.5 px-2.5 py-1.5 rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 group-active:opacity-100 transition-opacity duration-150 pointer-events-none z-20 ${ancoraggio}`}
                      style={{ backgroundColor: ink, color: paper, fontSize: 11, boxShadow: shadowMd }}>
                      {testoTooltip}
                    </div>
                  </div>
                );
              })}

            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

<StatPill icon={Footprints} label="Passeggiate" value={passeggiateOggi} tone="passeggiata" />
<StatPill icon={MapPin} label="Visite" value={visiteOggi} tone="visita" />

      <div className="mt-3">

  );

// ---------- Vista: Agenda ----------

// Mostra sempre: 1 mese precedente al mese visualizzato, poi il mese visualizzato (evidenziato),
// poi tutti i successivi. Si ricalcola ogni volta che meseVista/annoVista cambiano
// (anche navigando le settimane), non solo al mount.
function useMesiStripScroll(mesiStrip, meseVista, annoVista) {
  const containerRef = useRef(null);
  const itemRefs = useRef({});
  const [sliderStyle, setSliderStyle] = useState({ left: 0, width: 0, opacity: 0 });

  const scrollToMese = () => {
    const container = containerRef.current;
    if (!container) return;

    const currentIndex = mesiStrip.findIndex(
      (m) => m.getMonth() === meseVista && m.getFullYear() === annoVista
    );
    if (currentIndex === -1) return;

    // Posiziona la pastiglia scura esattamente sopra il mese attivo (per l'effetto "switch" animato).
    const activeMese = mesiStrip[currentIndex];
    const activeKey = `${activeMese.getFullYear()}-${activeMese.getMonth()}`;
    const activeEl = itemRefs.current[activeKey];
    if (activeEl) {
      const containerRectSlider = container.getBoundingClientRect();
      const activeRect = activeEl.getBoundingClientRect();
      const leftRelativo = activeRect.left - containerRectSlider.left + container.scrollLeft;
      setSliderStyle({ left: leftRelativo, width: activeEl.offsetWidth, opacity: 1 });
    }

    // 1 mese precedente visibile come primo elemento a sinistra, poi il mese corrente.
    const startIndex = Math.max(0, currentIndex - 2);
    const startMese = mesiStrip[startIndex];
    const startKey = `${startMese.getFullYear()}-${startMese.getMonth()}`;
    const startEl = itemRefs.current[startKey];
    if (!startEl) return;

    const containerRect = container.getBoundingClientRect();
    const startRect = startEl.getBoundingClientRect();
    const relativeLeft = startRect.left - containerRect.left + container.scrollLeft;
    container.scrollLeft = Math.max(0, relativeLeft);
  };

  useLayoutEffect(() => {
    scrollToMese();
  }, [meseVista, annoVista, mesiStrip]);

  useEffect(() => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => scrollToMese());
    }
    const container = containerRef.current;
    if (!container) return;
    const ro = new ResizeObserver(() => scrollToMese());
    ro.observe(container);
    return () => ro.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return { containerRef, itemRefs, sliderStyle };
}

function SettimanaEsplosa({ giorni, appuntamenti, animali, onApriModifica, onApriNuovo }) {

        {giorni.map((giorno) => {

          // Eventi "puntuali" (passeggiata/visita): solo giorno di ritiro/riconsegna, esclusi annullati.
          const eventiPuntuali = appuntamenti
            .filter((a) => a.stato !== "annullato" && a.tipo !== "Pensione" && (a.dataRitiro === iso || a.dataRiconsegna === iso))
            .map((a) => ({ a, ruolo: a.dataRitiro === iso ? "ritiro" : "riconsegna", ora: a.dataRitiro === iso ? a.oraRitiro : a.oraRiconsegna }));

          // Eventi "pensione": visibili per TUTTI i giorni del soggiorno (ingresso, intermedi, uscita).
          const pensioniGiornoLista = pensioniAttiveIn(iso, appuntamenti);
          const eventiPensione = pensioniGiornoLista.map((a) => {
            let fase = "intermedio";
            if (a.dataRitiro === iso) fase = "ingresso";
            else if (a.dataRiconsegna === iso) fase = "uscita";
            const ora = fase === "ingresso" ? a.oraRitiro : fase === "uscita" ? a.oraRiconsegna : "00:00";
            return { a, ruolo: fase, ora };
          });

          const eventi = [...eventiPuntuali, ...eventiPensione].sort((x, y) => x.ora.localeCompare(y.ora));

          return (

<div key={iso} className="rounded-2xl p-2.5 sm:p-3 transition-all duration-300" style={{ backgroundColor: isOggi ? "#FFFDF6" : "#FFFFFF", border: isOggi ? `1.5px solid ${gold}` : "1px solid #ECE7D8", boxShadow: isOggi ? shadowSm : shadowXs }}>
              <div className="flex items-center justify-between mb-1.5 flex-wrap gap-1.5">

// Stato di navigazione (meseVista/annoVista/weekEsplosa) ora SOLLEVATO in App,

function VistaAgenda({ appuntamenti, animali, clienti, onApriModifica, onApriNuovo, meseVista, annoVista, weekEsplosa, onSelezionaSettimana, onSelezionaMese }) {

  const mesiStrip = useMemo(() => Array.from({ length: 25 }, (_, i) => addMonths(new Date(OGGI.getFullYear(), OGGI.getMonth(), 1), i - 12)), []);

    while (cursor <= ultimoDelMese) { righe.push(Array.from({ length: 7 }, (_, i) => addDays(cursor, i))); cursor = addDays(cursor, 7); }

</button>

        <div ref={mesiStripRef} className="relative flex items-center gap-1 mb-2 overflow-x-auto pb-1 no-scrollbar" style={{ scrollBehavior: "smooth" }}>

            return (
              <button key={i} ref={(el) => { if (el) mesiItemRefs.current[key] = el; }} onClick={() => onSelezionaMese(m)}
                className="relative z-10 ff-sans text-xs px-3 py-1.5 rounded-full whitespace-nowrap shrink-0 transition-colors duration-200"
                style={{ color: attivo ? paper : faint, fontWeight: attivo ? 600 : 400 }}>
                {MESI[m.getMonth()]} {m.getFullYear() !== OGGI.getFullYear() ? `'${String(m.getFullYear()).slice(2)}` : ""}
              </button>
            );

        {/* Frecce allungate: occupano tutto lo spazio fino al testo centrale "Scorri Settimana",

        <div className="flex items-center gap-2 mb-2" style={{ height: 20 }}>
          <button onClick={settimanaPrec} className="flex-1 h-full rounded-md flex items-center justify-center transition-all duration-100 active:scale-95 active:shadow-inner" style={{ border: `1px solid ${ink}` }}>
  <ChevronLeft size={12} color={ink} />
</button>
<span className="shrink-0 text-center ff-sans font-medium px-2" style={{ color: muted, fontSize: 10, lineHeight: "20px" }}>Scorri Settimana</span>
<button onClick={settimanaSucc} className="flex-1 h-full rounded-md flex items-center justify-center transition-all duration-100 active:scale-95 active:shadow-inner" style={{ border: `1px solid ${ink}` }}>
  <ChevronRight size={12} color={ink} />
</button>
        </div>

        <RigaGiorniSettimana />
      </div>

      <div className="flex flex-col gap-2 mt-2">
        {settimane.map((giorniSettimana, idx) => {
          const isEsplosa = toISO(giorniSettimana[0]) === weekEsplosaISO;
          return isEsplosa ? (
            <SettimanaEsplosa key={idx} giorni={giorniSettimana} appuntamenti={appuntamentiVisibili} animali={animali} onApriModifica={onApriModifica} onApriNuovo={onApriNuovo} />
          ) : (
            <SettimanaCompatta key={idx} giorni={giorniSettimana} mese={meseVista} appuntamenti={appuntamentiVisibili} onSelect={() => onSelezionaSettimana(giorniSettimana[0])} />
          );
        })}
      </div>

      <div className="mt-3">
        <RigaGiorniSettimana />
      </div>

    

      </div>
  );
}

// ---------- Vista: Clienti & Animali ----------
function VistaClienti({ appuntamenti, animali, clienti, onSalvaClienteAnimale, onEliminaCliente }) {
  const [selId, setSelId] = useState(1);
  const [ricerca, setRicerca] = useState("");
  const [modale, setModale] = useState(null);
  const [espansoAperto, setEspansoAperto] = useState(false);
  const [infoRankingAperto, setInfoRankingAperto] = useState(false);
  const [confermaEliminaAperta, setConfermaEliminaAperta] = useState(false);
  // Richiesta 7: ordinamento alfabetico per nome animale, sia per la lista orizzontale
  // sia per il modale "Espandi" (entrambi derivano da questo stesso array coppie/coppieFiltrate).
  // Punto 4: i clienti "eliminati" (attivo:false) non compaiono più in questa lista operativa,
  // ma restano nel database e continuano a comparire nelle statistiche di Dashboard.
  const clientiAttivi = clienti.filter((cl) => cl.attivo !== false);
  const coppie = clientiAttivi.flatMap((cl) => animali.filter((a2) => a2.clienteId === cl.id).map((an) => ({ an, cl })))
    .sort((x, y) => x.an.nome.localeCompare(y.an.nome));
  const coppieFiltrate = ricerca.trim()
    ? coppie.filter(({ an, cl }) => an.nome.toLowerCase().includes(ricerca.toLowerCase()) || cl.nome.toLowerCase().includes(ricerca.toLowerCase()))
    : coppie;

  const a = animaleById(animali, selId) || coppie[0]?.an;
  const c = a ? clienteById(clienti, a.clienteId) : null;
const regoleIncompat = a ? (a.incompatibile || []) : [];
const incompatibiliEtichette = useMemo(() => etichetteIncompatAggregate(regoleIncompat, animali), [regoleIncompat, animali]);
  // Ranking relativo: ricalcolato su TUTTI i clienti ogni volta che cambia qualsiasi appuntamento.
  const rankingMap = useMemo(() => calcolaRankingRelativo(clienti, appuntamenti), [clienti, appuntamenti]);
  const ranking = c ? rankingMap[c.id] : null;


  // Ordine di esposizione = ordine di inserimento nel form: Razza → Taglia → Età.
  const sottotitolo = a ? [a.razza, a.taglia ? `Taglia ${a.taglia}` : "", formatEta(a.eta)].filter(Boolean).join(" · ") : "";


  const handleSalvaModale = async (datiCliente, datiAnimale, animaleId, clienteId) => {
    const nuoviId = await onSalvaClienteAnimale(datiCliente, datiAnimale, animaleId, clienteId);
    if (!nuoviId) {
      alert("Errore durante il salvataggio. Apri la Console del browser (F12) per i dettagli.");
      return;
    }
    if (nuoviId?.animaleId) setSelId(nuoviId.animaleId);
    setModale(null);
  };

 return (
    <div>
     <div className="sticky z-20 pb-2 pt-3 sm:pt-6 md:pt-10 -mt-3 sm:-mt-6 md:-mt-10" style={{ backgroundColor: paper, top: "max(env(safe-area-inset-top), 44px)" }}>
        <div className="mb-5 flex items-start justify-between flex-wrap gap-3">
          <h1 className="ff-serif text-[24px] sm:text-[32px] leading-tight" style={{ color: ink }}>Clienti & Animali</h1>
          <button onClick={() => setModale({ modo: "nuovo" })} className="ff-sans text-xs font-semibold flex items-center gap-1 px-3.5 h-9 rounded-xl shrink-0 transition-all duration-200" style={{ backgroundColor: gold, color: "#2A1C05", boxShadow: shadowGoldGlow }}>
    <Plus size={13} /> Nuovo cliente
  </button>

        </div>

        <div className="flex gap-1.5 mb-3">
          <div className="relative flex-1 min-w-0">
            <Search size={13} className="absolute left-3 top-1/2 -translate-y-1/2" color={faint} />
            <input className="w-full ff-sans text-sm rounded-lg pl-8 pr-3 h-9 outline-none" style={inputBg} value={ricerca} onChange={(e) => setRicerca(e.target.value)} placeholder="Cerca per nome animale o proprietario…" />
          </div>
          <button onClick={() => setEspansoAperto(true)} className="ff-sans text-xs font-medium px-3 h-9 rounded-lg shrink-0" style={{ backgroundColor: paperDeep, color: ink }}>
            Espandi
          </button>
        </div>

        <div className="flex gap-1.5 overflow-x-auto pb-2 mb-4 -mx-1 px-1">

          {coppieFiltrate.length === 0 && <p className="ff-sans text-xs" style={{ color: faint }}>Nessun risultato.</p>}
          {coppieFiltrate.map(({ an, cl }) => {
            const active = an.id === selId;
            return (
              <button key={an.id} onClick={() => setSelId(an.id)} className="ff-sans text-left rounded-xl px-2 py-1.5 flex items-center gap-1.5 shrink-0"
                style={{ backgroundColor: active ? pine : card, width: 104 }}>
                <Avatar foto={an.foto} size={26} active={active} />
                <div className="min-w-0">
                  <p className="text-[11px] truncate leading-tight" style={{ color: active ? paper : ink }}>{an.nome}</p>
                  <p className="text-[9px] truncate leading-tight" style={{ color: active ? "#C9CFBB" : faint }}>{cl.nome}</p>
                </div>
              </button>
            );
          })}
        </div>
      </div>
      </div>

      {a && c && (

        <div className="rounded-2xl p-4 sm:p-6" style={{ backgroundColor: card }}>
          <div className="flex items-start justify-between gap-3 mb-4">
            <div className="flex items-start gap-3 min-w-0 flex-1">
              <Avatar foto={a.foto} size={52} />
              <div className="min-w-0">
                <h2 className="ff-serif text-xl sm:text-2xl" style={{ color: ink }}>{a.nome}</h2>
                <p className="ff-sans text-xs sm:text-sm" style={{ color: muted, overflowWrap: "break-word", wordBreak: "keep-all" }}>{a.specie === "cane" ? "Cane" : "Gatto"} {etichettaSesso(a.sesso)}{sottotitolo ? ` · ${sottotitolo}` : ""}</p>
              </div>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              <button onClick={() => setModale({ modo: "modifica" })} className="ff-sans text-xs flex items-center gap-1 px-2.5 py-1.5 rounded-lg" style={{ backgroundColor: "#F2EFE6", color: gold }}><Pencil size={12} /> Modifica</button>
              <button onClick={() => setConfermaEliminaAperta(true)} className="ff-sans text-xs flex items-center gap-1 px-2.5 py-1.5 rounded-lg" style={{ backgroundColor: "#F2EFE6", color: coral }}><Trash size={12} /> Elimina</button>
            </div>
          </div>

          {confermaEliminaAperta && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" style={{ backgroundColor: "rgba(20,24,17,0.55)", backdropFilter: "blur(6px) saturate(140%)", WebkitBackdropFilter: "blur(6px) saturate(140%)" }}>
              <div className="ff-sans w-full max-w-sm rounded-[28px] p-5 sm:p-6 modal-enter" style={{ backgroundColor: card, boxShadow: shadowLg }}>
                <div className="flex items-center gap-2.5 mb-3">
                  <AlertTriangle size={20} color={coral} />
                  <h3 className="ff-serif text-xl" style={{ color: ink }}>Eliminare {c.nome}?</h3>
                </div>
                <p className="ff-sans text-sm mb-5" style={{ color: muted }}>Il cliente e i suoi animali non appariranno più nelle liste operative, ma lo storico delle prenotazioni resterà conservato e visibile in Dashboard.</p>
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <button onClick={() => setConfermaEliminaAperta(false)} className="ff-sans text-sm px-4 py-2.5 rounded-xl" style={{ backgroundColor: "#F2EFE6", color: muted }}>Annulla</button>
                  <button onClick={() => { onEliminaCliente(c.id); setConfermaEliminaAperta(false); setSelId(0); }} className="ff-sans text-sm font-medium px-4 py-2.5 rounded-xl" style={{ backgroundColor: coral, color: "#fff" }}>Conferma eliminazione</button>
                </div>
              </div>
            </div>
          )}


          <div className="ff-sans mb-4">
            <p className="text-sm" style={{ color: ink }}>{c.nome}</p>
            {c.telefono && <p className="text-xs flex items-center gap-1 mt-0.5" style={{ color: faint }}><Phone size={11} /> {c.telefono}</p>}
            {c.indirizzo && <p className="text-xs flex items-center gap-1 mt-0.5" style={{ color: faint }}><MapPin size={11} /> {c.indirizzo}</p>}
          </div>

          <div className="flex flex-wrap gap-1.5 mb-4">
            {a.temperamento.map((t, i) => <Chip key={i} tone="sage">{t}</Chip>)}
            {a.allergie !== "nessuna nota" && <Chip tone="coral">allergia: {a.allergie}</Chip>}
          </div>

          {incompatibiliEtichette.length > 0 && (
  <div className="mb-4 ff-sans text-xs rounded-xl px-3 py-2.5" style={{ backgroundColor: "#F0D2C6", color: coral }}>
    <p className="flex items-center gap-1.5 font-medium mb-1.5"><AlertTriangle size={13} /> Non affiancare a</p>
    <div className="flex flex-wrap gap-1.5">
      {incompatibiliEtichette.map((etichetta, i) => (<span key={i} className="ff-sans text-[11px] px-2 py-1 rounded-full inline-block" style={{ backgroundColor: "rgba(255,255,255,0.45)", color: coral }}>{etichetta}</span>))}
    </div>
  </div>
)}

          <div className="mb-4">
            <p className="ff-sans text-xs font-medium mb-1.5 flex items-center gap-1.5" style={{ color: muted }}><Pill size={12} /> Farmaci</p>
            {a.farmaci.length === 0 ? <p className="ff-sans text-xs" style={{ color: faint }}>Nessuno</p> : a.farmaci.map((f, i) => <p key={i} className="ff-sans text-xs" style={{ color: ink }}>{f.nome} — {f.orario}</p>)}
          </div>

          <div className="pt-4 mb-4" style={{ borderTop: "1px solid #E4E0D0" }}>
            <p className="ff-sans text-xs font-medium mb-1.5 flex items-center gap-1.5" style={{ color: muted }}><StickyNote size={12} /> Note</p>
            {!a.note && <p className="ff-sans text-xs" style={{ color: faint }}>Nessuna nota.</p>}
            <NotaGenerale testo={a.note} />
          </div>

          {ranking && (
            <div className="rounded-xl p-3.5" style={{ backgroundColor: "#F2EFE6" }}>
              <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                <p className="ff-sans text-[11px] font-medium flex items-center gap-1.5" style={{ color: muted }}>
                  <Star size={12} /> Ranking cliente
                  <button type="button" onClick={() => setInfoRankingAperto(!infoRankingAperto)} className="shrink-0"><Info size={13} color={faint} /></button>
                </p>
                <Chip tone={ranking.tono}>{ranking.etichetta}</Chip>
              </div>
              {infoRankingAperto && (
                <p className="ff-sans text-[11px] mb-2.5 leading-relaxed rounded-lg p-2.5" style={{ color: muted, backgroundColor: "#FFFFFF" }}>
                  Questo punteggio confronta ogni cliente con tutti gli altri tuoi clienti: chi porta più incasso, prenota più spesso, disdice di meno e ti è fedele da più tempo riceve il voto più alto; chi in questo momento ha i valori più bassi riceve il punteggio minimo. Non è un voto fisso: si ricalcola automaticamente ogni volta che registri un nuovo appuntamento, quindi la posizione di ciascun cliente può cambiare nel tempo.
                </p>
              )}
              <div className="w-full h-1.5 rounded-full mb-2.5" style={{ backgroundColor: "#E0DBC9" }}><div className="h-1.5 rounded-full" style={{ width: `${ranking.punteggio}%`, backgroundColor: gold }} /></div>
              <div className="grid grid-cols-2 gap-2 ff-sans">
                <div><p className="text-base font-medium" style={{ color: ink }}>{c.storicoServizi}</p><p className="text-[10px]" style={{ color: faint }}>prenotazioni</p></div>
                <div><p className="text-base font-medium" style={{ color: ink }}>€{c.storicoIncassoTotale}</p><p className="text-[10px]" style={{ color: faint }}>incasso</p></div>
              </div>
            </div>
          )}

        </div>
      )}

      {espansoAperto && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4" style={{ backgroundColor: "rgba(20,24,17,0.55)", backdropFilter: "blur(6px) saturate(140%)", WebkitBackdropFilter: "blur(6px) saturate(140%)" }}>
      <div className="ff-sans w-full max-w-md rounded-[28px] p-5 sm:p-6 max-h-[92vh] overflow-y-auto modal-enter" style={{ backgroundColor: card, boxShadow: shadowLg }}>

            <div className="flex items-center justify-between mb-4">
              <h3 className="ff-serif text-xl" style={{ color: ink }}>Tutti i clienti</h3>
              <button onClick={() => setEspansoAperto(false)}><X size={18} color={faint} /></button>
            </div>
            {coppieFiltrate.length === 0 && <p className="ff-sans text-sm" style={{ color: faint }}>Nessun risultato.</p>}
            <div className="flex flex-col gap-1.5">
              {coppieFiltrate.map(({ an, cl }) => {
                const active = an.id === selId;
                return (
                  <button key={an.id} onClick={() => { setSelId(an.id); setEspansoAperto(false); }} className="w-full text-left rounded-xl px-3 py-2 flex items-center gap-2.5"
                    style={{ backgroundColor: active ? pine : "#F2EFE6" }}>
                    <Avatar foto={an.foto} size={34} active={active} />
                    <div className="min-w-0">
                      <p className="text-sm truncate" style={{ color: active ? paper : ink }}>{an.nome}</p>
                      <p className="text-xs truncate" style={{ color: active ? "#C9CFBB" : faint }}>{cl.nome}</p>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

     {modale && (
        <ModaleClienteAnimale animaleEsistente={modale.modo === "modifica" ? a : null} clienteEsistente={modale.modo === "modifica" ? c : null}
          animaliTutti={animali} clientiTutti={clienti} onClose={() => setModale(null)} onSalva={handleSalvaModale} />
      )}
    </div>
  );
}
// ---------- Vista: Dashboard ----------
function SelettorePeriodo({ meseVal, annoVal, onMese, onAnno }) {
  // Finestra anni completamente dinamica: 5 anni indietro, anno corrente, 5 anni avanti.
  const anniBase = OGGI.getFullYear();
  const anni = Array.from({ length: 11 }, (_, i) => anniBase - 5 + i);
  return (
    <div className="flex gap-1.5" style={{ width: 190, height: 26 }}>
      <div className="relative flex-1">
        <select value={meseVal} onChange={(e) => onMese(Number(e.target.value))} className="ff-sans w-full h-full text-[11px] rounded-md pl-2 pr-5 outline-none" style={{ ...inputBg, appearance: "none" }}>
          {MESI_BREVI.map((m, i) => <option key={i} value={i}>{m}</option>)}
        </select>
        <ChevronDown size={10} className="absolute right-1.5 top-1/2 -translate-y-1/2 pointer-events-none" color={faint} />
      </div>
      <div className="relative flex-1">
        <select value={annoVal} onChange={(e) => onAnno(Number(e.target.value))} className="ff-sans w-full h-full text-[11px] rounded-md pl-2 pr-5 outline-none" style={{ ...inputBg, appearance: "none" }}>
          {anni.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
        <ChevronDown size={10} className="absolute right-1.5 top-1/2 -translate-y-1/2 pointer-events-none" color={faint} />
      </div>
    </div>
  );
}

function ModaleGiorno({ iso, appuntamenti, animali, clienti, onClose, onApriModifica }) {
  const eventi = appuntamenti.filter((a) => a.dataRitiro === iso || a.dataRiconsegna === iso || (a.tipo === "Pensione" && a.dataRitiro <= iso && a.dataRiconsegna >= iso))
    .sort((a, b) => a.oraRitiro.localeCompare(b.oraRitiro));
  const d = fromISO(iso);
  const titolo = `${GIORNI_FULL[(d.getDay() + 6) % 7]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4" style={{ backgroundColor: "rgba(20,24,17,0.55)", backdropFilter: "blur(6px) saturate(140%)", WebkitBackdropFilter: "blur(6px) saturate(140%)" }}>
      <div className="ff-sans w-full max-w-md rounded-[28px] p-5 sm:p-6 max-h-[85vh] overflow-y-auto modal-enter" style={{ backgroundColor: card, boxShadow: shadowLg }}>

        <div className="flex items-center justify-between mb-4">
          <h3 className="ff-serif text-xl" style={{ color: ink }}>{titolo}</h3>
          <button onClick={onClose}><X size={18} color={faint} /></button>
        </div>
        {eventi.length === 0 && <p className="ff-sans text-sm" style={{ color: faint }}>Nessun appuntamento in questa data.</p>}
        <div className="flex flex-col gap-2">
          {eventi.map((a) => {
            const animale = animaleById(animali, a.animaleId);
            const cliente = clienteById(clienti, a.clienteId);
            if (!animale || !cliente) return null;
            const annullato = a.stato === "annullato";
            const lbl = etichetteServizio(a.tipo);
            const col = coloriServizio(a.tipo);
            return (
              <button key={a.id} onClick={() => onApriModifica(a)} className="w-full text-left rounded-xl px-3.5 py-3" style={{ backgroundColor: annullato ? "#EFEBDF" : col.bg, opacity: annullato ? 0.65 : 1 }}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-sm font-medium" style={{ color: ink, textDecoration: annullato ? "line-through" : "none" }}>{a.tipo} · {animale?.nome}</span>
                  <span className="text-xs font-medium" style={{ color: muted }}>€{a.tariffaTotale}</span>
                </div>
                <p className="text-xs" style={{ color: faint }}>{cliente?.nome} — {lbl.inizio} {a.oraRitiro} · {lbl.fine} {a.oraRiconsegna}</p>
                {annullato && <Chip tone="coral">Annullato</Chip>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ---------- Modale Impostazioni: prezzi di default per servizio / specie / animale ----------
function ModaleImpostazioniPrezzi({ tariffeDefault, animali, onAggiungiRegola, onRimuoviRegola, onClose }) {
  const [tipoSel, setTipoSel] = useState("Passeggiata");
  const [ambito, setAmbito] = useState("tutti"); // "tutti" | "cane" | "gatto" | "animale"
  const [animaleSelId, setAnimaleSelId] = useState("");
  const [prezzoInput, setPrezzoInput] = useState("");

  const animaliOrdinati = useMemo(() => [...animali].sort((a, b) => a.nome.localeCompare(b.nome)), [animali]);

  const handleAggiungi = () => {
    const prezzoNum = Number(prezzoInput.replace(",", "."));
    if (!prezzoInput || isNaN(prezzoNum) || prezzoNum <= 0) return;
    if (ambito === "animale" && !animaleSelId) return;
    const regola = {
      tipo: tipoSel,
      specie: ambito === "cane" ? "cane" : ambito === "gatto" ? "gatto" : null,
      animaleId: ambito === "animale" ? Number(animaleSelId) : null,
      prezzo: prezzoNum,
    };
    onAggiungiRegola(regola);
    setPrezzoInput("");
    setAnimaleSelId("");
  };

  const etichettaAmbito = (t) => {
    if (t.animaleId) {
      const al = animaleById(animali, t.animaleId);
      return al ? al.nome : "Animale rimosso";
    }
    if (t.specie) return t.specie === "cane" ? "Cani" : "Gatti";
    return "Tutti gli animali";
  };

  // Raggruppa le regole esistenti per tipo di servizio, per una lettura più ordinata.
  const regolePerTipo = useMemo(() => {
    const gruppi = { "Passeggiata": [], "Visita domiciliare": [], "Pensione": [] };
    tariffeDefault.forEach((t) => { if (gruppi[t.tipo]) gruppi[t.tipo].push(t); });
    return gruppi;
  }, [tariffeDefault]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4" style={{ backgroundColor: "rgba(20,24,17,0.55)", backdropFilter: "blur(6px) saturate(140%)", WebkitBackdropFilter: "blur(6px) saturate(140%)" }}>
      <div className="ff-sans w-full max-w-md rounded-[28px] p-5 sm:p-6 max-h-[90vh] overflow-y-auto modal-enter" style={{ backgroundColor: card, boxShadow: shadowLg }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="ff-serif text-xl" style={{ color: ink }}>Impostazioni</h3>
          <button onClick={onClose}><X size={18} color={faint} /></button>
        </div>

        <p className="ff-sans text-xs mb-4" style={{ color: faint }}>
          Imposta un prezzo di default per ogni tipo di servizio — facoltativamente distinto per specie
          (cane/gatto) o per un animale specifico. Il prezzo più specifico disponibile viene proposto
          automaticamente quando crei una nuova prenotazione.
        </p>

        <div className="rounded-xl p-3.5 mb-4" style={{ backgroundColor: "#F2EFE6" }}>
          <p className="ff-sans text-xs font-medium mb-2.5" style={{ color: muted }}>Nuova regola</p>

          <Field label="Servizio">
            <select className={inputStyle} style={inputBg} value={tipoSel} onChange={(e) => setTipoSel(e.target.value)}>
              <option value="Passeggiata">Passeggiata</option>
              <option value="Visita domiciliare">Visita domiciliare</option>
              <option value="Pensione">Pensione</option>
            </select>
          </Field>

          <Field label="Applica a">
            <select className={inputStyle} style={inputBg} value={ambito} onChange={(e) => { setAmbito(e.target.value); setAnimaleSelId(""); }}>
              <option value="tutti">Tutti gli animali (tipologia)</option>
              <option value="cane">Solo cani</option>
              <option value="gatto">Solo gatti</option>
              <option value="animale">Animale specifico</option>
            </select>
          </Field>

          {ambito === "animale" && (
            <Field label="Animale">
              <select className={inputStyle} style={inputBg} value={animaleSelId} onChange={(e) => setAnimaleSelId(e.target.value)}>
                <option value="">Seleziona un animale…</option>
                {animaliOrdinati.map((al) => (<option key={al.id} value={al.id}>{al.nome}</option>))}
              </select>
            </Field>
          )}

          <Field label="Prezzo di default (€)">
            <input className={inputStyle} style={inputBg} inputMode="decimal" placeholder="Es. 15"
              value={prezzoInput} onChange={(e) => setPrezzoInput(e.target.value.replace(/[^0-9.,]/g, ""))} />
          </Field>

          <button type="button" onClick={handleAggiungi} className="ff-sans text-sm font-semibold px-4 py-2.5 rounded-xl w-full transition-all duration-200" style={{ backgroundColor: gold, color: "#2A1C05" }}>
            <Plus size={14} className="inline -mt-0.5 mr-1" /> Aggiungi regola
          </button>
        </div>

        <div className="pt-1">
          <p className="ff-sans text-xs font-medium mb-2" style={{ color: muted }}>Regole attive</p>
          {tariffeDefault.length === 0 && <p className="ff-sans text-xs" style={{ color: faint }}>Nessuna regola impostata — verranno usati i prezzi predefiniti dell'app.</p>}
          {["Passeggiata", "Visita domiciliare", "Pensione"].map((tipoGruppo) => (
            regolePerTipo[tipoGruppo].length > 0 && (
              <div key={tipoGruppo} className="mb-3">
                <p className="ff-sans text-[11px] font-medium mb-1.5" style={{ color: faint }}>{tipoGruppo}</p>
                <div className="flex flex-col gap-1.5">
                  {regolePerTipo[tipoGruppo].map((t) => (
                    <div key={t.id} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ backgroundColor: "#F7F4EA" }}>
                      <span className="ff-sans text-xs" style={{ color: ink }}>{etichettaAmbito(t)}</span>
                      <div className="flex items-center gap-2.5">
                        <span className="ff-sans text-xs font-medium" style={{ color: muted }}>€{t.prezzo}</span>
                        <button type="button" onClick={() => onRimuoviRegola(t.id)}><Trash size={13} color={coral} /></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )
          ))}
        </div>
     </div>
    </div>
  );
}

function VistaDashboard({ appuntamenti, clienti, animali, onApriModifica, tariffeDefault, onAggiungiTariffaDefault, onRimuoviTariffaDefault }) {
  const [periodo, setPeriodo] = useState("mese");
  const [ordina, setOrdina] = useState("incasso");
  const [filtroMese, setFiltroMese] = useState(OGGI.getMonth());
  const [filtroAnno, setFiltroAnno] = useState(OGGI.getFullYear());
  const [giornoSelezionato, setGiornoSelezionato] = useState(null);
  const [impostazioniAperte, setImpostazioniAperte] = useState(false);

  // Richiesta 8: le statistiche continuano a basarsi su tutti gli appuntamenti (anche se annullati vengono
  // esclusi dai totali economici, come già previsto originariamente — restano nel DB e nelle analisi).
  const statistiche = useMemo(() => calcolaStatistichePeriodo(appuntamenti, periodo, filtroMese, filtroAnno), [appuntamenti, periodo, filtroMese, filtroAnno]);

  const datiMese = useMemo(() => {
    const giorniNelMese = new Date(filtroAnno, filtroMese + 1, 0).getDate();
    return Array.from({ length: giorniNelMese }, (_, i) => {
      const d = new Date(filtroAnno, filtroMese, i + 1);
      const iso = toISO(d);
      const del = appuntamenti.filter((a) => a.dataRitiro === iso && a.stato !== "annullato");
      const somma = del.reduce((s, a) => s + a.tariffaTotale, 0);
      const passato = d <= OGGI;
      return { label: String(i + 1), incassato: passato ? somma : 0, previsto: passato ? 0 : somma, iso };
    });
  }, [appuntamenti, filtroMese, filtroAnno]);

  const datiAnno = useMemo(() => {
    return MESI_BREVI.map((label, m) => {
      const d1 = new Date(filtroAnno, m, 1), d2 = new Date(filtroAnno, m + 1, 0);
      const del = appuntamenti.filter((a) => a.stato !== "annullato" && fromISO(a.dataRitiro) >= d1 && fromISO(a.dataRitiro) <= d2);
      const incassato = del.filter((a) => fromISO(a.dataRitiro) <= OGGI).reduce((s, a) => s + a.tariffaTotale, 0);
      const previsto = del.filter((a) => fromISO(a.dataRitiro) > OGGI).reduce((s, a) => s + a.tariffaTotale, 0);
      return { label, incassato, previsto };
    });
  }, [appuntamenti, filtroAnno]);

  const dati = periodo === "mese" ? datiMese : datiAnno;
  const totIncassato = dati.reduce((s, d) => s + d.incassato, 0);
  const totPrevisto = dati.reduce((s, d) => s + d.previsto, 0);

  // Punto 4: la classifica è una lista OPERATIVA (visibile, potenzialmente navigabile) — i clienti
  // disattivati ("eliminati") non devono comparirvi. Lo storico economico aggregato (card "Incassato",
  // grafico andamento) resta invece intatto perché calcolato direttamente dagli appuntamenti storici,
  // indipendentemente da questo filtro — quindi nessun dato storico viene perso, solo la riga nominativa
  // nella classifica "attiva" viene nascosta.
  const classifica = useMemo(() => {
    return clienti.filter((c) => c.attivo !== false).map((c) => {
      const recenti = appuntamenti.filter((a) => a.clienteId === c.id && a.stato !== "annullato");
      const incassoRecente = recenti.reduce((s, a) => s + a.tariffaTotale, 0);
      return { ...c, incassoTotale: c.storicoIncassoTotale + incassoRecente, serviziTotali: c.storicoServizi + recenti.length };
    }).sort((a, b) => ordina === "incasso" ? b.incassoTotale - a.incassoTotale : b.serviziTotali - a.serviziTotali);
  }, [clienti, appuntamenti, ordina]);



  const maxValore = useMemo(() => Math.max(1, ...classifica.map((c) => ordina === "incasso" ? c.incassoTotale : c.serviziTotali)), [classifica, ordina]);
  const etichettaPeriodo = periodo === "mese" ? `${MESI[filtroMese]} ${filtroAnno}` : `anno ${filtroAnno}`;

  const handleBarClick = (data) => {
    if (periodo !== "mese" || !data || !data.iso) return;
    setGiornoSelezionato(data.iso);
  };

 return (
    <div className="max-w-4xl">
      <div className="sticky top-0 z-20 pb-3 pt-3 sm:pt-6 md:pt-10 -mt-3 sm:-mt-6 md:-mt-10" style={{ backgroundColor: paper }}>
        <div className="mb-5"><h1 className="ff-serif text-[24px] sm:text-[32px] leading-tight" style={{ color: ink }}>Dashboard</h1></div>
        <div className="flex items-stretch justify-between gap-3 mb-5">
          {/* Riquadro riepilogo periodo — stesso template della card "Incassato": si aggiorna da solo
              seguendo esattamente la selezione dei filtri a destra (mese/anno + relativi select). */}
